      document.body.appendChild(ghost);
      const st=document.getElementById('defstatus');
      const curCost=()=>Math.round(it.cost*(1+0.5*arr.filter(d=>d.id===it.id).length));
      const upd=()=>{ st.textContent='拖到地图上松手布置「'+it.nm+'」 · 金币 '+SAVE.coins+' − '+curCost()+' = '+(SAVE.coins-curCost())+'（同类越多越贵）'; };
      upd();
      const mv=e=>{ const p=tp(e); ghost.style.left=p.clientX+'px'; ghost.style.top=p.clientY+'px'; if(e.cancelable&&e.touches) e.preventDefault(); };
      const fin=e=>{
        document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',fin);
        document.removeEventListener('touchmove',mv,{passive:false}); document.removeEventListener('touchend',fin);
        ghost.remove();
        const p=tp(e);
        // 原地点一下(没拖动)=查看详细介绍
        if(Math.hypot(p.clientX-sx,p.clientY-sy)<10 && Date.now()-t0<400){ showDefDetail(it); return; }
        const map=ch.querySelector('[style*="aspect-ratio"]');
        if(!map) return;
        const r=map.getBoundingClientRect();
        if(p.clientX<r.left||p.clientX>r.right||p.clientY<r.top||p.clientY>r.bottom) return; // 拖回按钮区=取消
        if(SAVE.coins<curCost()){ ovT.textContent='⚠️ 金币不足（需要 '+curCost()+'，同类道具越买越贵）'; setTimeout(()=>ovT.textContent=((()=>{const Q=PAGES.defend;return typeof Q.title==='function'?Q.title():Q.title;}))(),900); return; }
        if(arr.length>=8){ ovT.textContent='⚠️ 每关最多8个道具'; setTimeout(()=>ovT.textContent=((()=>{const Q=PAGES.defend;return typeof Q.title==='function'?Q.title():Q.title;}))(),900); return; }
        const x=(p.clientX-r.left)/r.width*WW, y=(p.clientY-r.top)/r.height*WH;
        // ---- 防刷金币：同一位置同类道具禁止重复放置；每类最多4个 ----
        if(arr.some(d=>d.id===it.id&&Math.hypot(d.x-x,d.y-y)<30)){ setTimeout(()=>ovT.textContent=((()=>{const Q=PAGES.defend;return typeof Q.title==='function'?Q.title():Q.title;}))(),900); ovT.textContent='⚠️ 这个位置已经有「'+it.nm+'」了'; return; }
        if(arr.filter(d=>d.id===it.id).length>=4){ setTimeout(()=>ovT.textContent=((()=>{const Q=PAGES.defend;return typeof Q.title==='function'?Q.title():Q.title;}))(),900); ovT.textContent='⚠️ 「'+it.nm+'」每关最多布置4个'; return; }
        if(SAVE.tut===2&&it.id!=='turret'){ setTimeout(()=>ovT.textContent=((()=>{const Q=PAGES.defend;return typeof Q.title==='function'?Q.title():Q.title;}))(),1200); ovT.textContent='教程：先拖动机枪（炮塔）到地图上'; return; }
        SAVE.coins-=curCost(); arr.push({id:it.id,x:Math.round(x),y:Math.round(y)}); persist(); buildDefend();
        // ---- 教程：布防两个机枪后引导出战 ----
        if(SAVE.tut===2&&arr.filter(d=>d.id==='turret').length>=2){ SAVE.tut=3; persist(); ovT.textContent='✅ 教程完成！点下方「出战第1关」开始战斗'; Spot.show([navPlay],'教程完成！点击出战第1关！'); }
      };
      document.addEventListener('mousemove',mv); document.addEventListener('mouseup',fin);
      document.addEventListener('touchmove',mv,{passive:false}); document.addEventListener('touchend',fin);
      document.addEventListener('touchcancel',fin); // 系统中断也必须清理，否则全局滚动被永久锁死
      dragCleanup=()=>{ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',fin);
        document.removeEventListener('touchmove',mv,{passive:false}); document.removeEventListener('touchend',fin);
        document.removeEventListener('touchcancel',fin); ghost.remove(); };
    };
    b.addEventListener('mousedown',beginDrag);
    b.addEventListener('touchstart',beginDrag,{passive:false});
    b.addEventListener('touchcancel',()=>{ dragCleanup&&dragCleanup(); dragCleanup=null; });
    bar.appendChild(b);
  }
  ch.appendChild(bar);
  const st0=document.createElement('p'); st0.id='defstatus';
  st0.textContent=(SAVE.tut===2?'📖 教程：拖「自动炮塔 🔫」到地图上，放两个（新手100金币够买2个） · ':'按住道具拖到地图上松手购买 · ')+'当前金币 '+SAVE.coins+' · 已布置 '+arr.length+'/8';
  ch.appendChild(st0);
  const map=document.createElement('div');
  map.style.cssText='position:relative; width:min(340px,88%); aspect-ratio:1600/1040; background:linear-gradient(160deg,#14213d,#0d1730); border:2px solid rgba(255,255,255,.2); border-radius:12px; cursor:crosshair; overflow:hidden;';
  for(let i=1;i<8;i++){ const l=document.createElement('div'); l.style.cssText='position:absolute; top:0; bottom:0; left:'+(i*12.5)+'%; width:1px; background:rgba(255,255,255,.06);'; map.appendChild(l); }
  for(let i=1;i<5;i++){ const l=document.createElement('div'); l.style.cssText='position:absolute; left:0; right:0; top:'+(i*20)+'%; height:1px; background:rgba(255,255,255,.06);'; map.appendChild(l); }
  for(const d of arr){
    const m=document.createElement('div');
    const it=DEF_MAP[d.id];
    m.style.cssText='position:absolute; left:'+(d.x/WW*100)+'%; top:'+(d.y/WH*100)+'%; transform:translate(-50%,-50%); font-size:15px; filter:drop-shadow(0 1px 3px #000); cursor:pointer;';
    m.textContent=it.ic;
    m.onclick=()=>{ SAVE.coins+=Math.floor(it.cost/2); arr.splice(arr.indexOf(d),1); persist(); buildDefend(); };
    map.appendChild(m);
  }
  ch.appendChild(map);
  // 聚光灯：教程中照住「自动炮塔按钮」+「地图」；完成后照住「出战」按钮
  if(SAVE.tut===2){ const tBtn=bar.querySelector('button'); if(tBtn) Spot.show([tBtn,map],'按住「自动炮塔 🔫」拖到地图上松手，放两个'); }
  else if(SAVE.tut===3&&arr.length){ Spot.show([navPlay],'教程完成！点击出战第1关！'); }
}
function renderShop(){
  for(const it of SHOP_ITEMS){
    const l=SAVE.up[it.id], maxed=l>=it.max, cost=it.cost(l);
    const c=document.createElement('div'); c.className='card';
    c.innerHTML='<div class="ic">'+it.ic+'</div><div class="nm">'+it.nm+' Lv'+l+'/'+it.max+'</div><div class="ds">'+it.ds+'</div><div class="lv">'+(maxed?'✅ 已满级':'💰 '+cost+' 购买')+'</div>';
    if(maxed){ c.style.opacity=.5; }
    else if(SAVE.tut===1&&it.id!=='hp'){ c.style.opacity=.3; c.onclick=()=>{ ovT.textContent='教程：先购买「装甲强化」❤️'; setTimeout(()=>{ovT.textContent='🛒 永久商店';},1000); }; }
    else c.onclick=()=>{ if(SAVE.coins>=cost){ SAVE.coins-=cost; SAVE.up[it.id]++; persist();
        if(SAVE.tut===1&&it.id==='hp'){ SAVE.tut=2; persist(); showPage('home'); } else showPage('shop'); } };
    ch.appendChild(c);
  }
  // 聚光灯：教程阶段只准买装甲强化
  if(SAVE.tut===1){ const cards=ch.querySelectorAll('.card'); if(cards[1]) Spot.show([cards[1]],'点击购买「装甲强化 ❤️」'); }
}

function startLevel(){ testBoss=null; rushOn=false; nav.classList.add('hidden'); startGame(); }
function startRush(){ testBoss=null; rushOn=true; nav.classList.add('hidden'); startGame(); }
function startTest(){ nav.classList.add('hidden'); startGame(); }
function levelComplete(){
  if(!S) return; // Boss死亡后的延迟回调时可能已退出，防崩溃
  S.over=true; pauseBtn.classList.add('hidden'); dashBtn.classList.add('hidden');
  AudioSys.stopMusic();
  if(S.test){ // 测试模式不计奖励不解锁
    ovT.textContent='✅ Boss测试完成';
    ovX.innerHTML='用时 '+Math.floor(S.t)+' 秒 · 剩余 HP '+Math.ceil(S.hp);
    ch.innerHTML='';
    const tb=document.createElement('button'); tb.textContent='🔁 再测一次'; tb.onclick=()=>{ testBoss='pun'; startGame(); }; ch.appendChild(tb);
    const hb=document.createElement('button'); hb.textContent='🏠 主页'; hb.style.background='#888'; hb.onclick=()=>showPage('home'); ch.appendChild(hb);
    ov.classList.remove('hidden'); return;
  } nav.classList.add('hidden');
  SAVE.coins+=S.coinsRun+250; // 通关奖励+额外250
  SAVE.unlocked=Math.max(SAVE.unlocked, Math.min(selLevel+1,5));
  if(!SAVE.stats) SAVE.stats={kills:0,best:0,maxLv:0};
  SAVE.stats.maxLv=Math.max(SAVE.stats.maxLv, selLevel);
  SAVE.defense[selLevel]=[]; persist(); // 每关结束清空场上道具
  showPageHome=()=>showPage('home');
  ovT.textContent='🏆 第'+selLevel+'关 通关！';
  ovX.innerHTML='金币 +<b id="resCoins">0</b>（含通关奖励250，现共 '+SAVE.coins+'）· 击杀 '+S.kills+' · 等级 '+S.lvl;
  ch.innerHTML='';
  if(selLevel<5){ const nb=document.createElement('button'); nb.textContent='➡ 下一关'; nb.onclick=()=>{ selLevel++; startLevel(); }; ch.appendChild(nb); }
  const hb=document.createElement('button'); hb.textContent='🏠 返回主页'; hb.style.background='#888'; hb.onclick=()=>showPage('home'); ch.appendChild(hb);
  playResultAnim(S.coinsRun+250);
  ov.classList.remove('hidden');
}
showPage('home');

// ---- 声音开关按钮（右上角） ----
const sndBtn=document.createElement('button');
dashBtn.onclick=charSkill; // 角色主动技能（手机按钮/空格）
touchBtn(dashBtn,charSkill); touchBtn(pauseBtn,()=>{ if(S&&!S.over&&!S.choosing&&!S.paused) togglePause(); }); // 双指游戏时按钮直通
sndBtn.style.cssText='position:absolute; top:26px; right:8px; z-index:4; padding:5px 12px; font-size:13px; letter-spacing:0; background:linear-gradient(180deg,#3a5a9e,#27406e); color:#cfe0ff; box-shadow:0 3px 0 #16244a;';
sndBtn.textContent=SAVE.sound===false?'🔇':'🔊';
sndBtn.onclick=()=>{ SAVE.sound=(SAVE.sound===false); persist(); sndBtn.textContent=SAVE.sound?'🔊':'🔇';
  if(!SAVE.sound) AudioSys.stopMusic(); else if(S&&!S.over&&page!=='home') AudioSys.startMusic(S.bossCount>0); };
document.getElementById('wrap').appendChild(sndBtn);

// ---- 新手教程欢迎页：送100金币 ----
if(SAVE.tut===0){
  setTimeout(()=>{
    const ov2=document.getElementById('overlay'), ovT2=document.getElementById('ovTitle'),
          ovX2=document.getElementById('ovText'), ch2=document.getElementById('choices');
    ovT2.textContent='🎓 欢迎来到像素幸存者！';
    ovX2.innerHTML='新手礼包：<b>100 金币</b><br><br>接下来跟着教程学会强化和布防，轻松打赢第一关！';
    ch2.innerHTML='';
    const b=document.createElement('button'); b.textContent='🎁 领取 100 金币，开始教程';
    b.onclick=()=>{ SAVE.coins+=100; SAVE.tut=1; persist(); coinEl.textContent=SAVE.coins; showPage('home'); };
    ch2.appendChild(b);
    ov2.classList.remove('hidden','menu');
  },400);
}

pauseBtn.onclick=()=>{ if(S&&!S.over&&!S.choosing&&!S.paused) togglePause(); };
btn.addEventListener('click',()=>{ if(!S||S.over){} });
})();
</script>
