<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>像素幸存者</title>
<style>
  :root{ --fg:#eef2ff; --muted:#9fb0d0; --accent:#ffb428; --gold1:#ffe27a; --gold2:#f7a916; --panel:#1b2a4a; --panel2:#24365e;
    --glass:rgba(28,40,78,.72); --glassbd:rgba(140,170,255,.22); --cy:#4fc3d9; --gr:#4ce07a; --pu:#a78bdb; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0; background:radial-gradient(120% 100% at 50% 0%, #16224a 0%, #0d1526 60%, #090e1c 100%); font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--fg); min-height:100dvh;}
  body{display:flex; align-items:center; justify-content:center;}
  #wrap{width:100%; max-width:860px; margin:0 auto; position:relative; box-shadow:0 0 60px rgba(30,50,120,.35); border-radius:14px;}
  canvas{display:block; width:auto; height:auto; max-width:100%; max-height:100dvh; margin:0 auto; border-radius:14px; touch-action:none; background:#1a2332;}
  /* ---- HUD: 玻璃胶囊 ---- */
  #ui{position:absolute; top:10px; left:10px; right:10px; padding:0; pointer-events:none; display:flex; justify-content:space-between; align-items:flex-start; gap:8px; font-size:clamp(10px,2.6vw,13px); flex-wrap:wrap;}
  #uiright{display:flex; flex-direction:column; gap:5px; align-items:flex-end;}
  .tutdim{opacity:.35!important; filter:grayscale(.85); pointer-events:none;}
  #ui span{background:linear-gradient(180deg,rgba(36,44,86,.78),rgba(18,22,52,.82)); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); border:1px solid var(--glassbd); border-radius:999px; padding:5px 13px; box-shadow:0 4px 12px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12); text-shadow:0 1px 2px #000; white-space:nowrap;}
  .stat{font-weight:bold; color:#ffd76a;}
  #xpslot{position:absolute; left:0; top:18%; height:64%; width:13px; background:rgba(8,16,34,.72); backdrop-filter:blur(4px); border:1.5px solid rgba(255,255,255,.24); border-radius:0 8px 8px 0; box-shadow:0 2px 10px rgba(0,0,0,.45), inset 1px 0 0 rgba(255,255,255,.06); overflow:hidden;}
  #xpbar{position:absolute; bottom:0; left:0; right:0; height:0%; transition:height .15s; background:linear-gradient(0deg,#1fa94e,#4ce07a 60%,#a5ffc4); box-shadow:0 0 12px rgba(76,224,122,.8);}
  #xpbar::after{content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 40%); }
  #xptext{position:absolute; left:16px; top:50%; transform:translateY(-50%); writing-mode:vertical-rl; font-size:9px; font-weight:bold; color:#b8ffd2; opacity:.9; text-shadow:0 1px 2px #000; pointer-events:none;}
  /* ---- 覆盖层：手游主界面 ---- */
  #overlay{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:rgba(8,14,28,.9); border-radius:14px; text-align:center; padding:18px; z-index:5; overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y;}
  #overlay, #overlay *{touch-action:pan-y;} /* 全浮层允许纵向滚动，任何子元素不得再禁用 */
  #overlay.hidden{display:none;}
  #overlay.menu{background:radial-gradient(120% 90% at 50% 0%, #4a3a9e 0%, #2a1f6f 45%, #0e0a3a 100%); overflow-y:auto; justify-content:flex-start; padding-top:26px; padding-bottom:110px; -webkit-overflow-scrolling:touch; touch-action:pan-y;}
  #overlay.menu::before{content:''; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(60% 40% at 50% 108%, rgba(255,180,40,.16), transparent 70%),
      radial-gradient(1.2px 1.2px at 12% 18%, rgba(255,255,255,.8), transparent 55%),
      radial-gradient(1px 1px at 30% 8%, rgba(200,220,255,.7), transparent 55%),
      radial-gradient(1.4px 1.4px at 55% 22%, rgba(255,255,255,.6), transparent 55%),
      radial-gradient(1px 1px at 72% 12%, rgba(180,200,255,.75), transparent 55%),
      radial-gradient(1.2px 1.2px at 88% 26%, rgba(255,255,255,.65), transparent 55%),
      radial-gradient(1px 1px at 44% 34%, rgba(220,235,255,.55), transparent 55%),
      radial-gradient(1.1px 1.1px at 8% 40%, rgba(200,220,255,.5), transparent 55%),
      radial-gradient(1px 1px at 65% 44%, rgba(255,255,255,.5), transparent 55%),
      radial-gradient(1.3px 1.3px at 92% 52%, rgba(210,225,255,.55), transparent 55%);}
  @keyframes ovPop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
  @keyframes ovRise{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
  .res-pop{animation:ovPop .5s cubic-bezier(.2,1.5,.4,1) both;}
  .res-rise{animation:ovRise .45s ease-out both;}
  #overlay h2{margin:0; font-size:clamp(22px,7vw,32px); font-weight:900; letter-spacing:3px;
    background:linear-gradient(180deg,#fff6cf 20%,#ffd76a 55%,#f7a916 90%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 2px 0 rgba(120,60,0,.65)) drop-shadow(0 4px 10px rgba(0,0,0,.5));}
  #overlay p{margin:0; color:var(--muted); font-size:13px; max-width:520px; line-height:1.7;}
  #overlay p b{color:#ffd76a;}
  #choices{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; position:relative; width:100%; max-width:560px; margin:0 auto;}
  /* ---- 卡片：玻璃质感 + 稀有度描边 ---- */
  .card{width:168px; background:linear-gradient(180deg,rgba(44,58,110,.85),rgba(22,30,64,.9)); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border:1.5px solid var(--glassbd); border-radius:16px; padding:12px 10px; cursor:pointer; transition:transform .12s, border-color .12s, box-shadow .12s; pointer-events:auto;
    box-shadow:0 8px 20px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.1); position:relative; overflow:hidden;}
  .card.rw{border-color:rgba(79,195,217,.55);}   /* 武器专属：青 */
  .card.rd{border-color:rgba(76,224,122,.55);}   /* 布防专属：绿 */
  .card.rc{border-color:rgba(167,139,219,.65); box-shadow:0 8px 20px rgba(0,0,0,.45), 0 0 16px rgba(167,139,219,.3), inset 0 1px 0 rgba(255,255,255,.1);} /* 角色专属：紫辉 */
  .card:hover{transform:translateY(-4px); border-color:var(--accent); box-shadow:0 12px 26px rgba(0,0,0,.5), 0 0 0 1px rgba(255,180,40,.4);}
  .card::before{content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);}
  .card::after{content:''; position:absolute; top:0; left:-60%; width:40%; height:100%; background:linear-gradient(105deg,transparent,rgba(255,255,255,.12),transparent); transform:skewX(-18deg); animation:cardShine 3.4s infinite;}
  @keyframes cardShine{0%,64%{left:-60%}78%{left:130%}100%{left:130%}}
  .hint{letter-spacing:.5px;}
  .card:active{transform:scale(.97);}
  .card .ic{font-size:30px; width:52px; height:52px; line-height:52px; margin:0 auto; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.22), rgba(10,16,40,.55) 70%);
    border:1px solid rgba(255,255,255,.18); box-shadow:inset 0 2px 4px rgba(255,255,255,.12), 0 3px 8px rgba(0,0,0,.4);
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));}
  .card .nm{font-weight:bold; margin:8px 0 4px; font-size:14px; color:#ffe9b8;}
  .card .ds{font-size:11px; color:var(--muted); line-height:1.5;}
  .card .lv{font-size:10px; color:#7fd17f; margin-top:4px;}
  #pauseBtn.hidden,#btn.hidden{display:none;}
  /* ---- 按钮：橙色立体（顶部高光） ---- */
  button{border:none; border-radius:12px; padding:12px 26px; font-size:16px; font-weight:900; cursor:pointer; pointer-events:auto;
    background:linear-gradient(180deg,#ffdd8a 0%,#ffc95e 18%,#ff9d1e 62%,#f2820a 100%); color:#4a2500; letter-spacing:2px;
    box-shadow:0 4px 0 #c15f00, 0 7px 14px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.55); text-shadow:0 1px 0 rgba(255,255,255,.35);}
  button:active{transform:translateY(3px); box-shadow:0 1px 0 #c15f00, 0 3px 8px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.45);}
  /* ---- 底部导航：玻璃条 ---- */
  #nav{position:absolute; bottom:0; left:0; right:0; display:flex; z-index:6; gap:10px; padding:12px 12px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(12,22,48,.88),rgba(6,13,30,.96)); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border-top:1.5px solid rgba(255,180,40,.35); border-radius:0 0 14px 14px;}
  #nav button{flex:1; min-width:0; font-size:17px; padding:14px 0; border-radius:14px; letter-spacing:3px;
    background:linear-gradient(180deg,#ffdd8a 0%,#ffc95e 18%,#ff9d1e 62%,#f2820a 100%); color:#4a2500;
    box-shadow:0 4px 0 #c15f00, 0 6px 14px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.5);}
  #nav button:active{transform:translateY(3px);}
  #nav.hidden{display:none;}
  /* ---- 关卡列表 ---- */
  #lvlist{display:flex; flex-direction:column; gap:12px; width:min(340px,88%); align-items:stretch; position:relative;}
  #lvlist button{width:100%; font-size:16px; padding:14px 0; letter-spacing:1px; border-radius:14px; text-align:left; padding-left:18px;
    background:linear-gradient(180deg,rgba(44,58,110,.85),rgba(24,32,66,.9)); color:var(--fg);
    border:1.5px solid var(--glassbd); box-shadow:0 4px 0 rgba(5,10,24,.9), inset 0 1px 0 rgba(255,255,255,.08);}
  #lvlist button:active{transform:translateY(2px);}
  #lvlist button.locked{background:#111624; color:#6a7590; border-color:#222a3e; box-shadow:0 3px 0 rgba(5,10,24,.9); filter:saturate(.4);}
  #lvlist button.sel{border-color:#4ce07a; color:#b8ffd2; box-shadow:0 4px 0 rgba(5,10,24,.9), 0 0 14px rgba(76,224,122,.35);}
  .hint{margin-top:8px; text-align:center; font-size:12px; color:#7285a8; position:relative;}
  /* ---- 三选一：固定布局，不随屏幕宽度漂移 ---- */
  .pickwrap{display:flex; gap:12px; justify-content:center; align-items:stretch; width:100%; max-width:560px;}
  .pickwrap .card{flex:1 1 0; min-width:0; width:auto; display:flex; flex-direction:column;}
  @media(max-width:560px){ .pickwrap{flex-direction:column; max-width:300px; width:88%;} .pickwrap .card{width:100%;} }
  /* ---- 角色武器选择页 ---- */
  .rosterRow{width:100%; height:calc(100dvh/6); max-height:110px; display:flex; align-items:center; gap:14px; border-radius:16px;
    background:linear-gradient(180deg,rgba(44,58,110,.85),rgba(22,30,64,.9)); border:1.5px solid var(--glassbd); padding:0 18px;
    cursor:pointer; pointer-events:auto; box-shadow:0 6px 16px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.1); transition:transform .12s, border-color .12s, box-shadow .12s; position:relative;}
  .rosterRow:active{transform:scale(.98);}
  .rosterRow .thumb{font-size:34px; width:64px; height:64px; line-height:64px; text-align:center; border-radius:50%; flex:0 0 auto;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.22), rgba(10,16,40,.55) 70%); border:1px solid rgba(255,255,255,.18);
    box-shadow:inset 0 2px 4px rgba(255,255,255,.12), 0 3px 8px rgba(0,0,0,.4);}
  .rosterRow .rnm{font-size:18px; font-weight:900; letter-spacing:2px;}
  .rosterRow .cur{margin-left:auto; font-size:12px; color:#ffd76a; letter-spacing:1px;}
  .rosterRow.sel{border-color:#ffd76a; box-shadow:0 6px 16px rgba(0,0,0,.4), 0 0 14px rgba(255,215,106,.35), inset 0 1px 0 rgba(255,255,255,.1);}
  #dtBox{width:min(360px,92%); background:linear-gradient(180deg,rgba(44,58,110,.92),rgba(20,28,60,.96)); backdrop-filter:blur(8px);
    border:1.5px solid rgba(255,215,106,.45); border-radius:18px; padding:18px; pointer-events:auto; box-shadow:0 12px 34px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.12);}
  #dtBox .ic{font-size:56px; width:96px; height:96px; line-height:96px; margin:0 auto;}
  #dtBox .nm{font-size:20px; font-weight:900; letter-spacing:2px; margin:10px 0 6px; color:#ffe9b8;}
  #dtBox .ds{font-size:13px; color:var(--muted); line-height:1.8; text-align:left;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="800" height="520"></canvas>
  <div id="xpslot"><div id="xpbar"></div></div>
  <div id="xptext">0/5</div>
  <div id="ui">
    <span>❤️ <span class="stat" id="hp">10/10</span></span>
    <div id="uiright">
      <span>💰 <span class="stat" id="coin">0</span></span>
      <span>⏱ <span class="stat" id="time">0:00</span></span>
    </div>
  </div>
  <div id="overlay">
    <h2 id="ovTitle">像素幸存者</h2>
    <p id="ovText">小人会<b>自动开枪</b>攻击最近的怪物，你只负责走位躲避。<br>怪物从四周缓慢围过来，杀死它们掉落<b>绿色经验宝石</b>，靠近自动捡起升级，每次升级<b>三选一天赋</b>。<br><br>电脑：WASD/方向键 · 手机：手指拖动屏幕</p>
    <div id="choices"></div>
    <button id="btn">开始游戏</button>
  </div>
  <button id="pauseBtn" class="hidden" style="position:absolute; top:26px; left:8px; z-index:4; padding:5px 12px; font-size:13px;">⏸</button>
  <button id="dashBtn" class="hidden" style="position:absolute; bottom:14px; right:8px; z-index:4; padding:8px 14px; font-size:16px;">⚡</button>
  <div id="nav" class="hidden">
    <button id="navShop">🛒 商店</button>
    <button id="navRoster">🎭 角色</button>
    <button id="navReward">🎁 奖励</button>
    <button id="navPlay">▶ 开始战斗</button>
  </div>
  <div class="hint">怪物会越刷越多越来越快 · 活下去！</div>
</div>
<script>
(function(){
addEventListener('error',e=>{var t=document.getElementById('ovTitle'),x=document.getElementById('ovText');if(t){t.textContent='⚠️ 脚本加载出错';if(x)x.textContent=(e.message||'')+' —— 请用浏览器直接打开本文件游玩。';}});
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
// ---- 竖屏自适应 + 高清屏（DPR）适配：逻辑分辨率不变，物理分辨率×DPR 抗糊 ----
let DPR=1;
(function(){
  const vw=(typeof window!=='undefined'&&window.innerWidth)||0;
  const vh=(typeof window!=='undefined'&&window.innerHeight)||0;
  DPR=Math.min((typeof window!=='undefined'&&window.devicePixelRatio)||1,2);
  let lw=800, lh=520;
  if(vw&&vh&&vh>vw){ lw=Math.max(360,Math.min(560,Math.round(vw)));
    lh=Math.max(540,Math.min(940,Math.round(vh*0.92))); }
  cv.width=Math.round(lw*DPR); cv.height=Math.round(lh*DPR);
  cv._lw=lw; cv._lh=lh;
})();
const W=cv._lw, H=cv._lh;
const WW=W*2, WH=H*2; // 世界是屏幕的2倍
const ov=document.getElementById('overlay'), ovT=document.getElementById('ovTitle'), ovX=document.getElementById('ovText'), ch=document.getElementById('choices'), btn=document.getElementById('btn'), pauseBtn=document.getElementById('pauseBtn'), nav=document.getElementById('nav'), navShop=document.getElementById('navShop'), navRoster=document.getElementById('navRoster'), navReward=document.getElementById('navReward'), navPlay=document.getElementById('navPlay'), dashBtn=document.getElementById('dashBtn');
let dtBack=null; // 详情页点击空白退出的监听句柄
const hpEl=document.getElementById('hp'), tEl=document.getElementById('time'), xpEl=document.getElementById('xpbar'), xpNextEl=document.getElementById('xptext'), coinEl=document.getElementById('coin');
const rand=(a,b)=>a+Math.random()*(b-a);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

let S=null, selLevel=1;
const keys={};
// ---------- persistent save ----------
window.__sv={ get S(){return S;}, set S(v){S=v;} };
const DEFAULT_SAVE={coins:0, unlocked:1, up:{dmg:0,hp:0,spd:0,rate:0}};
let SAVE;
try{ SAVE=JSON.parse(localStorage.getItem('sv_save'))||JSON.parse(JSON.stringify(DEFAULT_SAVE)); }catch(e){ SAVE=JSON.parse(JSON.stringify(DEFAULT_SAVE)); }
SAVE.up=Object.assign({dmg:0,hp:0,spd:0,rate:0},SAVE.up);
SAVE.defense=SAVE.defense||{};
if(!SAVE.char) SAVE.char='warrior';   // 角色：warrior/scholar/merchant/engineer
if(!SAVE.weapon) SAVE.weapon='gun';   // 武器：gun/rocket/blade
let _pTimer=null;
function _flushSave(){ _pTimer=null; try{ localStorage.setItem('sv_save',JSON.stringify(SAVE)); }catch(e){} }
function persist(){ SAVE.lastSeen=Date.now(); if(!_pTimer) _pTimer=setTimeout(_flushSave,400); }
addEventListener('beforeunload',()=>{ if(_pTimer){ clearTimeout(_pTimer); _flushSave(); } });
// ---- 每日任务 ----
const DAILY_TASKS=[
 {id:'kills', ic:'💀', nm:'击杀 50 只怪物', need:50, r:100},
 {id:'coins', ic:'💰', nm:'拾取 300 金币', need:300, r:150},
 {id:'secs',  ic:'⏱', nm:'单局存活 180 秒', need:180, r:200},
];
function ensureDaily(){ if(!SAVE.daily||SAVE.daily.date!==todayStr()){ SAVE.daily={date:todayStr(),kills:0,coins:0,secs:0,claimed:[false,false,false],ad:0}; persist(); } }
// ---- 成就系统 ----
const ACHIEVEMENTS=[
 {id:'k100',  ic:'💀', nm:'新手猎人：累计击杀 100',  test:v=>v.kills>=100,  r:200},
 {id:'k1000', ic:'⚔️', nm:'杀怪如麻：累计击杀 1000', test:v=>v.kills>=1000, r:600},
 {id:'k5000', ic:'🔥', nm:'怪物末日：累计击杀 5000', test:v=>v.kills>=5000, r:2000},
 {id:'b200',  ic:'🌟', nm:'单局击杀 200',            test:v=>v.best>=200,   r:400},
 {id:'l3',    ic:'🏅', nm:'打通第三关',              test:v=>v.maxLv>=3,    r:500},
 {id:'l5',    ic:'👑', nm:'打通第五关（通关！）',    test:v=>v.maxLv>=5,    r:1500},
];
function achStats(){ return {kills:SAVE.stats&&SAVE.stats.kills||0, best:SAVE.stats&&SAVE.stats.best||0, maxLv:SAVE.stats&&SAVE.stats.maxLv||0}; }
let OFFLINE_GIFT=0;
try{
  const last=(JSON.parse(localStorage.getItem('sv_save')||'{}').lastSeen)||0; // 先读盘, 防止 ensureDaily 的 persist 覆盖
  const mins=Math.floor((Date.now()-last)/60000);
  if(mins>=1) OFFLINE_GIFT=Math.min(500, mins*2); // 离线收益上限500
  ensureDaily();
}catch(e){}
if(SAVE.sound===undefined) SAVE.sound=true;
// ---- 新手教程状态：0=未开始 1=去商店买血量 2=布防放两个机枪 3=完成 ----
if(SAVE.tut===undefined) SAVE.tut=0;
// ==================== 聚光灯引导引擎 ====================
// 用 clip-path 在暗色遮罩上"挖洞"：洞外变暗且不可点，洞内元素正常交互
let dragCleanup=null; // 布防拖拽的全局清理句柄（页面切换/touchcancel 时调用）
const Spot={
  wrap:null,
  show(targets,text){
    this.hide();
    if(!targets||!targets.length) return;
    const pad=8, W=window.innerWidth, H=window.innerHeight;
    for(const t of targets){ const r=t.getBoundingClientRect();
      if(r.bottom<0||r.top>H||r.right<0||r.left>W) t.scrollIntoView({block:'center'}); }
    const rects=targets.map(t=>{ const r=t.getBoundingClientRect();
      return [Math.max(0,r.left-pad),Math.max(0,r.top-pad),Math.min(W,r.right+pad),Math.min(H,r.bottom+pad)]; });
    const wrap=document.createElement('div');
    wrap.style.cssText='position:fixed; inset:0; z-index:90; pointer-events:none;';
    // ---- 挡板：用矩形条拼出洞口（不依赖 clip-path 的点击穿透，兼容所有手机内核） ----
    const catcher=(l,t,r,b)=>{ const d=document.createElement('div');
      d.style.cssText='position:fixed; left:'+l+'px; top:'+t+'px; width:'+(r-l)+'px; height:'+(b-t)+'px; background:rgba(4,9,22,.9); pointer-events:auto;';
      wrap.appendChild(d); };
    const sorted=rects.slice().sort((a,b)=>a[1]-b[1]);
    let y=0;
    for(const [l,t,r,b] of sorted){
      if(t>y) catcher(0,y,W,t-y);           // 洞上方整条
      if(l>0) catcher(0,t,l,b-t);           // 洞左侧
      if(r<W) catcher(r,t,W-r,b-t);         // 洞右侧
      y=Math.max(y,b);
    }
    if(y<H) catcher(0,y,W,H-y);             // 最后一个洞下方整条
    for(const [l,t,r,b] of rects){ // 发光洞边框

const AudioSys={
  ctx:null, musicTimer:null, step:0,
  ensure(){ if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return false; } } if(this.ctx.state==='suspended') this.ctx.resume(); return true; },
  sfx(type){
    if(SAVE.sound===false||!this.ensure()) return;
    const c=this.ctx, t=c.currentTime;
    const g=c.createGain(); g.connect(c.destination);
    if(type==='shoot'){ const o=c.createOscillator(); o.type='square';
      o.frequency.setValueAtTime(680,t); o.frequency.exponentialRampToValueAtTime(160,t+0.06);
      g.gain.setValueAtTime(0.028,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.07);
      o.connect(g); o.start(t); o.stop(t+0.08);
    } else if(type==='hit'){ const n=c.createBufferSource(), len=0.04*44100|0,
      buf=c.createBuffer(1,len,44100), d=buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
      n.buffer=buf; const f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=900;
      g.gain.setValueAtTime(0.05,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.045);
      n.connect(f); f.connect(g); n.start(t);
    } else if(type==='kill'){ const o=c.createOscillator(); o.type='triangle';
      o.frequency.setValueAtTime(300,t); o.frequency.exponentialRampToValueAtTime(90,t+0.12);
      g.gain.setValueAtTime(0.06,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.13);
      o.connect(g); o.start(t); o.stop(t+0.14);
    } else if(type==='boss'){ const o=c.createOscillator(); o.type='sawtooth';
      o.frequency.setValueAtTime(110,t); o.frequency.linearRampToValueAtTime(55,t+0.6);
      g.gain.setValueAtTime(0.12,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.7);
      o.connect(g); o.start(t); o.stop(t+0.72);
    } else if(type==='lvl'){ const seq=[523,659,784,1047];
      seq.forEach((f,i)=>{ const o=c.createOscillator(); o.type='sine'; o.frequency.value=f;
        const g2=c.createGain(); g2.gain.setValueAtTime(0.001,t+i*0.09);
        g2.gain.exponentialRampToValueAtTime(0.09,t+i*0.09+0.02); g2.gain.exponentialRampToValueAtTime(0.001,t+i*0.09+0.12);
        o.connect(g2); g2.connect(c.destination); o.start(t+i*0.09); o.stop(t+i*0.09+0.14); });
    } else if(type==='coin'){ const o=c.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(1200,t); o.frequency.setValueAtTime(1600,t+0.05);
      g.gain.setValueAtTime(0.04,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.1);
      o.connect(g); o.start(t); o.stop(t+0.11);
    } else if(type==='hurt'){ const o=c.createOscillator(); o.type='sawtooth';
      o.frequency.setValueAtTime(200,t); o.frequency.exponentialRampToValueAtTime(60,t+0.15);
      g.gain.setValueAtTime(0.08,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.16);
      o.connect(g); o.start(t); o.stop(t+0.17);
    }
  },
  // 简易战斗 BGM：小调贝斯线 + 底鼓，随Boss战切换紧张音阶
  startMusic(boss){
    if(SAVE.sound===false||!this.ensure()) return;
    this.stopMusic();
    const scale=[110,110,131,110,98,98,131,147]; // A小调根音
    const seq=boss? [147,147,175,147,131,131,175,196]:scale;
    this.step=0;
    this.musicTimer=setInterval(()=>{
      if(SAVE.sound===false){ return; }
      const c=this.ctx, t=c.currentTime, f=seq[this.step%8];
      const o=c.createOscillator(), g=c.createGain();
      o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(0.05,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.22);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+0.24);
      if(this.step%2===0){ // 底鼓
        const o2=c.createOscillator(), g2=c.createGain();
        o2.type='sine'; o2.frequency.setValueAtTime(150,t); o2.frequency.exponentialRampToValueAtTime(45,t+0.1);
        g2.gain.setValueAtTime(0.09,t); g2.gain.exponentialRampToValueAtTime(0.001,t+0.12);
        o2.connect(g2); g2.connect(c.destination); o2.start(t); o2.stop(t+0.13);
      }
      this.step++;
    },260);
  },
  stopMusic(){ if(this.musicTimer){ clearInterval(this.musicTimer); this.musicTimer=null; } }
};

  const hpM=(15+S.t*0.75)*((isQQ||isPun)?4:1)*((isNecro)?5:1)*mul*(S.rushMode?1+S.rushN*0.6:1); // 球球/惩罚者 = 史莱姆 x4，死灵 x5
  const side=Math.random()*4|0;
  const b={x:side===0?-35:side===1?WW+35:rand(80,WW-80), y:side===2?-35:side===3?WH+35:rand(80,WH-80),
    hp:hpM, maxhp:hpM, spd:55, r:26, dmg:3, color:isNecro?'#b08ff0':isPun?'#9b59d0':isQQ?'#4f8fe0':'#e03e6e', dark:isNecro?'#7a5ab0':isPun?'#6f3aa0':isQQ?'#2f5fa0':'#a02048',
    hitT:0, xp:12, type:'boss', bossName:name, bossType:bt, gen:0, dead:false, wob:0,
    chargeT:0, tele:0, teleA:0, dashT:0, dashA:0, barrageT:0, barrageNext:rand(4,6), ebullets:[]};
  b.spd=Math.min(b.spd,70);
  S.bossSpawnAt=S.t; S.enemies.push(b); S.bossCount++;
  AudioSys.sfx('boss'); AudioSys.startMusic(true);
  // ---- 第4关起：双Boss同时登场 ----
  if(selLevel>=4&&!testBoss&&!S.rushMode){
    const b2=JSON.parse(JSON.stringify(b));
    b2.bossType= bt==='pun'?'qq':'pun';
    b2.bossName= b2.bossType==='qq'?'球球':'惩罚者';
    b2.color= b2.bossType==='qq'?'#4f8fe0':'#9b59d0';
    b2.dark= b2.bossType==='qq'?'#2f5fa0':'#6f3aa0';
    b2.hp=hpM; b2.maxhp=hpM; b2.x=rand(80,WW-80); b2.y=-35; b2.ebullets=[];
    S.enemies.push(b2); S.bossCount++;
    S.texts.push({txt:'⚠️ 双BOSS「'+b.bossName+'」+「'+b2.bossName+'」来袭！', life:3});
    return;
  }
  S.texts.push({txt:'⚠️ BOSS「'+name+'」来袭！'+((isQQ&&!isPun&&!isNecro)?' 小心冲刺！':isPun?' 小心弹幕！':isNecro?' 小心召唤与冲刺！':''), life:2.5});
}
function spawnBossChild(x,y,gen,maxhp,e){
  const hp=gen===1? maxhp*0.3 : maxhp*0.5; // 大→中30%，中→小50%
  const c={x:x+rand(-14,14), y:y+rand(-14,14), hp, maxhp:hp,
    spd:55, r:gen===1?20:15, dmg:gen===1?2:1, color:e.bossType==='qq'?'#4f8fe0':e.bossType==='necro'?'#b08ff0':'#e03e6e', dark:e.bossType==='qq'?'#2f5fa0':e.bossType==='necro'?'#7a5ab0':'#a02048',
    hitT:0, xp:gen===1?4:2, type:'boss', bossName:e.bossName, bossType:e.bossType, gen, dead:false, wob:Math.random()*6,
    chargeT:0, tele:0, teleA:0, dashT:0, dashA:0};
  S.enemies.push(c); S.bossCount++;
}

// ---------- combat ----------
function playerDmg(){ return (1+0.01*SAVE.up.dmg)*(1+0.25*S.keys.dmg)*(S.runDmg||1)*(SAVE.char==='scholar'?0.9:SAVE.char==='engineer'?0.85:1); }
function fireRate(){ return 1.4*(1+0.01*SAVE.up.rate)*(1+0.25*S.keys.rate); }
function weaponFireMul(){ return SAVE.weapon==='rocket'?0.5:SAVE.weapon==='blade'?1.6:1; } // 火箭筒0.5×攻速/砍刀更快
function fire(){
  if(SAVE.weapon==='blade'){ fireBlade(); return; }
  const n=(SAVE.weapon==='gun')?(1+S.keys.multi):1;
  const k1=Math.min(3,n);
  launchVolley(k1); // 第一排：一次最多3发扇形
  if(n>k1){ S.volleyPending=n-k1; S.volleyT=0.28; } // 第二排接力：等第一排出手后再射
}
function fireBlade(){ // 砍刀：敌人进入攻击范围才挥刀，扇形群伤，可暴击
  const lvl0=S.keys.blr||0;
  const RMAX=70*(1+0.05*lvl0)*1.3; // 最大索敌范围（含挥刀弧半径余量）
  let tgt=null,best=1e9;
  for(const e of S.enemies){ if(e.dead)continue;
    if(e.x<S.camx-40||e.x>S.camx+W+40||e.y<S.camy-40||e.y>S.camy+H+40) continue;
    const d=dist(e,S); if(d<RMAX+e.r*0.5&&d<best){best=d;tgt=e;} }
  if(!tgt) return; // 没进范围就站着不动（不挥刀）
  const lvl=S.keys.blr||0;
  const R=70*(1+0.05*lvl), arc=Math.PI/2+Math.PI*0.2*lvl; // 90°起，每级+36°，5级=270°(75%圆)
  const a0=Math.atan2(tgt.y-S.py,tgt.x-S.px);
  S.aimA=a0; S.faceA=a0;
  let hit=false;
  for(const e of S.enemies){ if(e.dead)continue;
    const d=dist(e,S); if(d>R+e.r*0.5)continue;
    let df=Math.atan2(e.y-S.py,e.x-S.px)-a0;
    while(df>Math.PI)df-=2*Math.PI; while(df<-Math.PI)df+=2*Math.PI;
    if(Math.abs(df)<=arc/2+ (e.r/Math.max(40,d)) ){
      const crit=Math.random()<0.13*S.keys.crit || S.uberT>0;
      const bd=playerDmg()*(crit?2:1); // 砍刀伤害 1×，可暴击2×
      e.hp-=bd; e.hitT=0.1; hitFx(e);
      if(crit){ S.shake=Math.max(S.shake||0,3); }
      S.dnums.push({x:e.x+rand(-4,4),y:e.y-e.r-4,v:Math.round(bd*10)/10,crit,life:0.7,vy:-40});
      if(S.keys.shrap){ // 碎片溅射：向敌人身后(挥砍方向)125°扇形
        for(const o of S.enemies){ if(o.dead||o===e)continue;
          const dO=dist(o,e); if(dO>R)continue;
          let dfa=Math.atan2(o.y-e.y,o.x-e.x)-a0;
          while(dfa>Math.PI)dfa-=2*Math.PI; while(dfa<-Math.PI)dfa+=2*Math.PI;
          if(Math.abs(dfa)<=125*Math.PI/360){ o.hp-=bd*0.8; o.hitT=0.1; hitFx(o);
            // 碎片飞溅特效：白色碎片从主目标向受击者方向飞散
            for(let k=0;k<4;k++){ const sa=a0+rand(-0.9,0.9), sp2=rand(60,140);
              S.parts.push({x:e.x+rand(-3,3),y:e.y+rand(-3,3),vx:Math.cos(sa)*sp2,vy:Math.sin(sa)*sp2,life:0.28,maxlife:0.28,shard:true,color:'#cfe2ff',r:rand(1.5,2.5)}); }
            S.dnums.push({x:o.x+rand(-4,4),y:o.y-o.r-4,v:Math.round(bd*0.8*10)/10,crit:false,life:0.7,vy:-40});
            if(o.hp<=0) killEnemy(o); } } }
      if(e.hp<=0) killEnemy(e); hit=true; } }
  if(hit){ AudioSys.sfx('hit'); S.shake=Math.max(S.shake||0,2);
    for(const e2 of S.enemies){ if(e2.hitT>=0.09&&dist(e2,S)<R+20&&!e2.dead){ // 命中火花
      S.parts.push({ring:true,x:e2.x,y:e2.y,r:0,max:20,life:0.2,maxlife:0.2,color:'#ffe9b8'}); } } }
  S.parts.push({slash:true,sweep:true,x:S.px,y:S.py,a:a0,r:R,arc,life:0.22,maxlife:0.22}); // 扫过式挥砍弧光
  S.parts.push({slash:true,sweep:true,x:S.px,y:S.py,a:a0,r:R*0.62,arc:arc*0.85,life:0.16,maxlife:0.16}); // 内层余辉
  S.swing=0.18; // 挥刀动作
}
function launchVolley(m){
  const isR=SAVE.weapon==='rocket';
  let tgt=null, best=1e9;
  for(const e of S.enemies){
    if(e.x<S.camx-40||e.x>S.camx+W+40||e.y<S.camy-40||e.y>S.camy+H+40) continue; // 不打屏外
    const d=dist(e,S); if(d<best){best=d;tgt=e;}
  }
  if(!tgt)return; // 视野内没怪就不开枪
  S.muzzle=0.08; // 枪口火光（确认有目标才亮）
  AudioSys.sfx('shoot');
  const base=Math.atan2(tgt.y-S.py, tgt.x-S.px);
  S.aimA=base;
  const spread=m>1?0.2:0, sp=isR?280:420;
  for(let i=0;i<m;i++){
    const a=base+(i-(m-1)/2)*spread;
    S.bullets.push({x:S.px+Math.cos(S.aimA)*10,y:S.py-2+Math.sin(S.aimA)*10,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:isR?2.2:1.6,pierce:isR?0:S.keys.pierce,rocket:isR,hitset:new Set(),dmg0:isR?playerDmg()*2.2:undefined});
  }
  // muzzle flash
  S.parts.push({x:S.px+Math.cos(S.aimA)*14, y:S.py-2+Math.sin(S.aimA)*14, vx:0, vy:0, life:0.08, color:isR?'#ffb428':'#fff6c8', r:isR?7:5});
}
function charSkill(){ // 角色主动技能：勇士=冲刺 学者=专注 商人=召唤商店 工程师=临时炮台
  if(!S||S.over||S.paused||S.choosing) return;
  if(S.skillCd>0) return;
  const c=SAVE.char||'warrior';
  if(c==='scholar'){ S.uberT=6; S.skillCd=15; S.texts.push({txt:'📖 专注！6秒必定暴击！',life:1.5}); AudioSys.sfx('lvl'); }
  else if(c==='merchant'){ const max=1+(S.keys.mer2||0); // 本局随时可放，次数=1+专属卡
    if((S.airUsed||0)>=max){ S.texts.push({txt:'✈️ 本局召唤次数已用完',life:1.2}); return; }
    S.airUsed=(S.airUsed||0)+1; S.airBuyN=0; openAirshop(); } // 每次主动召唤重置限购 // Boss不受清扫影响, 也不会被消灭
  else if(c==='engineer'){ const two=(S.keys.eng2||0)>0;
    S.defs.push({id:'turret',x:S.px,y:S.py,cd:0,ang:0,temp:true,life:15});
    if(two) S.defs.push({id:'turret',x:S.px+28,y:S.py+18,cd:0,ang:0,temp:true,life:15}); // 专属：每次两个
    S.skillCd=45; S.texts.push({txt:'🔧 临时炮台部署！'+(two?' ×2':''),life:1.5}); AudioSys.sfx('coin'); }
  else { if(S.dashCd>0||S.dashing>0) return;
    const warr=(S.keys.warr||0)>0;
    S.dashing=0.16; S.dashInv=warr?0.35:0.32; S.dashA=S.faceA||0; // 专属：冲刺全程无敌
    S.skillCd=(warr?8:5)*(1-0.2*S.keys.wind); } // 专属：冷却+3s(5→8s)作为代价
}
function dash(){ /* 已并入 charSkill（勇士主动技能） */ }
function hurtHero(d){
  if(S.dashInv>0) return false; // 冲刺无敌帧
  if(S.keys.shield&&S.shieldT<=0){ S.shieldT=20-3*S.keys.shield; S.texts.push({txt:'🔵 护盾抵挡！',life:1}); AudioSys.sfx('hurt'); return false; }
  S.hp-=d; S.hurtT=0.08; S.redT=0.2; AudioSys.sfx('hurt'); return true;
}
function doNova(){
  const R=90+30*S.keys.nova, dmg=playerDmg()*2;
  for(const e of S.enemies){ if(dist(e,S)<R){ e.hp-=dmg; e.hitT=0.12; hitFx(e); if(e.hp<=0) killEnemy(e); } }
  S.parts.push({ring:true,x:S.px,y:S.py,r:0,max:R,life:0.35,maxlife:0.35});
}
function killEnemy(e){
  e.dead=true; S.kills++;
  // 连击系统：2.5秒内连续击杀累积，每10连击奖励金币
  if((S.comboT||0)>0) S.combo=(S.combo||0)+1; else S.combo=1;
  S.comboT=2.5;
  if(S.combo>0 && S.combo%10===0){ const bonus=S.combo/2; // 10连+5、20连+10…
    S.coinsRun+=bonus; S.texts.push({txt:'🔥 '+S.combo+' 连击！金币 +'+bonus, life:1.6}); AudioSys.sfx('lvl'); }
  if(SAVE.daily){ SAVE.daily.kills++; persist(); }
  if(!SAVE.stats) SAVE.stats={kills:0,best:0,maxLv:0};
  SAVE.stats.kills++;
  // 连杀播报（手感/成就感）
  if([10,25,50,100,200].indexOf(S.kills)>=0){ S.texts.push({txt:'🔥 连杀 x'+S.kills+'！', life:1.5}); AudioSys.sfx('lvl'); }
  else AudioSys.sfx('kill');
  // 分裂怪：死后裂成两只小的
  if(e.type==='splitter'){
    for(let i=0;i<2;i++) S.enemies.push({x:e.x+rand(-10,10),y:e.y+rand(-10,10),hp:e.maxhp*0.35,maxhp:e.maxhp*0.35,spd:Math.min(e.spd*1.5,90),r:7,dmg:1,color:'#e0c04c',dark:'#a8913a',xp:1,type:'mini',hitT:0,dead:false,wob:Math.random()*6});
  }
  if(S.keys.regen && Math.random()<0.15+0.07*S.keys.regen && S.hp<S.maxhp){
    S.hp=Math.min(S.maxhp,S.hp+1);
    S.parts.push({x:S.px,y:S.py-16,vx:0,vy:-30,life:0.6,color:'#7dff9e',r:4});
  }
  for(let i=0;i<(e.type==='boss'?16:e.type==='elite'?7:3);i++)
    S.parts.push({x:e.x+rand(-6,6),y:e.y+rand(-6,6),vx:rand(-70,70),vy:rand(-70,70),life:0.45,color:e.color,r:rand(2,3.5)});
  const n=e.type==='boss'?10:e.type==='elite'?3:e.type==='tank'?2:1;
  for(let i=0;i<n;i++) S.gems.push({x:e.x+rand(-12,12),y:e.y+rand(-12,12),v:e.type==='boss'?5:e.type==='elite'?3:e.type==='tank'?2:1,ph:Math.random()*6});
  // 金币掉落 45%
  if(Math.random()<(SAVE.char==='merchant'?0.65:0.45)){
    const cv2=e.type==='boss'?5:e.type==='elite'?3:1;
    S.coins.push({x:e.x,y:e.y,v:cv2,ph:Math.random()*6});
  }
  if(e.type==='boss'){
    S.bossCount--;
    if(SAVE.char==='merchant') S.skillCd=0; // 商人：任意Boss死后立刻可召唤空中商店
    if(e.gen<2 && e.bossType!=='qq' && e.bossType!=='pun' && e.bossType!=='necro'){ spawnBossChild(e.x,e.y,e.gen+1,e.maxhp,e); spawnBossChild(e.x,e.y,e.gen+1,e.maxhp,e); } // 大史莱姆死后分裂（Rush 也分裂, 保证波次能结束）
    if(S.bossCount===0){
      if(S.rushMode){
        S.rushN++; S.nextBossAt=S.t+3;
        const rw=40+S.rushN*20; S.coinsRun+=rw; // Boss挑战通关奖励金币：逐波递增
        S.texts.push({txt:'😈 第 '+S.rushN+' 波 Boss 3秒后到来！奖励 💰'+rw+'！', life:2.5});
      } else S.nextBossAt=S.t+150;
      S.texts.push({txt:'💥 BOSS 爆炸！清场！', life:2.5});
      S.stopT=0.5; // 击杀慢动作（手感）
      if(!S.rushMode){ S.pendComplete=true; S.pendAt=S.t; } // Rush不结算; 1.2s游戏时间后自动结算（选卡期间顺延, 不依赖setTimeout防节流）
      S.shake=10; S.redT=0.15;
      S.parts.push({ring:true,x:e.x,y:e.y,r:0,max:Math.max(WW,WH),life:0.7,maxlife:0.7});
      for(const o of S.enemies){ if(o.type!=='boss'&&!o.dead){ o.dead=true; S.kills++;
        for(let i=0;i<2;i++) S.gems.push({x:o.x+rand(-8,8),y:o.y+rand(-8,8),v:1,ph:Math.random()*6}); } }
    }
  }
}
function hitFx(e){ for(let i=0;i<3;i++) S.parts.push({x:e.x,y:e.y,vx:rand(-60,60),vy:rand(-60,60),life:0.2,color:'#fff',r:2}); }

// ---------- leveling ----------
function gainXP(v){
  S.xp+=v*(1+0.25*S.keys.xp)*(SAVE.char==='scholar'?1.3:1);
  while(S.xp>=S.xpNext){ S.xp-=S.xpNext; S.lvl++; S.xpNext=Math.floor(3+S.lvl*2+S.lvl*S.lvl*0.3); levelUp(); } // 更平缓: 1级5/10级53/20级143/30级303
}
function levelUp(){
  AudioSys.sfx('lvl');
  const wsel=SAVE.weapon||'gun';
  let avail=UPGRADES.filter(u=>S.keys[u.id]<u.max && !u.ch && (!u.w||u.w===wsel) && (!u.def||S.defs.some(d=>d.id===u.def)) && ((u.id!=='tdmg'&&u.id!=='trate') || S.defs.some(d=>d.id==='turret')));
  // 角色专属卡只通过下方 charEx 注入（仅限当前角色），绝不进普通卡池
  function grantBown(){ // 学者「博闻」：一次性随机获得2张（不三选一），带获得动画（期间游戏暂停）
    const pool=avail.filter(u=>!u.ch).slice(); const got=[];
    for(let i=0;i<2&&pool.length;i++){ const u=pool.splice(Math.random()*pool.length|0,1)[0];
      S.keys[u.id]++; if(u.id==='hp'){ S.maxhp+=2; S.hp=S.maxhp; } got.push(u); }
    S.choosing=true; ch.innerHTML='';
    ovT.textContent='✨ 博闻触发！随机获得：';
    const w2=document.createElement('div'); w2.style.cssText='display:flex; gap:10px; justify-content:center;';
    for(const u of got){ const c2=document.createElement('div'); c2.className='card res-rise'+(u.ch?' rc':u.def?' rd':u.w?' rw':'');
      c2.innerHTML=`<div class="ic">${u.ic}</div><div class="nm">${u.nm}</div><div class="ds">${u.ds}</div><div class="lv">Lv ${S.keys[u.id]}</div>`;
      w2.appendChild(c2); }
    ch.appendChild(w2);
    const kb=document.createElement('button'); kb.textContent='继续'; kb.className='res-rise'; kb.style.animationDelay='0.3s';
    kb.onclick=()=>{ S.choosing=false; ch.innerHTML=''; ov.classList.add('hidden'); loop(); };
    ch.appendChild(kb);
    ov.classList.remove('hidden'); ov.classList.remove('menu');
  }
  if(SAVE.char==='engineer'){ const dup=avail.filter(u=>u.id==='tdmg'||u.id==='trate'); avail=avail.concat(dup); } // 工程师：机枪卡牌概率增高(副本引用, 防止同一张卡重复出现)
  const picks=[];
  while(picks.length<3&&avail.length) picks.push(avail.splice(Math.random()*avail.length|0,1)[0]);
  const uniq=[...new Set(picks)]; picks.length=0; picks.push(...uniq); // 工程师复制引用可能重复，去重防同一张卡出现两次
  // 专属卡保底：连续3次升级没出本武器专属卡 → 本次必补一张
  const exclAvail=UPGRADES.filter(u=>u.w===wsel && S.keys[u.id]<u.max);
  if(!picks.some(u=>u.w) && exclAvail.length && (S.exclDry||0)>=2){
    picks[picks.length-1]=exclAvail[Math.random()*exclAvail.length|0];
  }
  S.exclDry=picks.some(u=>u.w)?0:(S.exclDry||0)+1;
  // 角色专属卡：低概率出现（25%，仅限本角色）
  const charEx=UPGRADES.filter(u=>u.ch===SAVE.char && S.keys[u.id]<u.max);
  if(charEx.length && !picks.some(u=>u.ch) && Math.random()<0.12) picks[picks.length-1]=charEx[Math.random()*charEx.length|0]; // 角色专属：再次缩减概率(25%→12%)
  S.choosing=true;
  ch.innerHTML='';
  const p=document.createElement('p'); p.innerHTML='<b>⬆️ 升级！选择一项天赋</b>'; ch.appendChild(p);
  const pw=document.createElement('div'); pw.className='pickwrap'; // 三选一固定布局：等宽三张，窄屏纵向
  for(const u of picks){
    const c=document.createElement('div'); c.className='card'+(u.ch?' rc':u.def?' rd':u.w?' rw':'');
    c.innerHTML=`<div class="ic">${u.ic}</div><div class="nm">${u.nm}</div><div class="ds">${u.ds}</div><div class="lv">Lv ${S.keys[u.id]} → ${S.keys[u.id]+1}</div>`;
    c.onclick=()=>{
      S.keys[u.id]++;
      if(u.id==='hp'){S.maxhp+=2; S.hp=S.maxhp;}

      ov.classList.add('hidden');
      loop();

    pw.appendChild(c);

  ch.appendChild(pw); // 三选一容器
  ovT.textContent='LEVEL UP!';
  if((S.refreshN||0)<3){ // 金币刷新卡牌：10金币一次，每局限3次
    const rb=document.createElement('button');
    const wallet=SAVE.coins+S.coinsRun;
    rb.textContent='🔄 刷新卡牌（💰 10 · 本局剩 '+(3-(S.refreshN||0))+' 次）'+(wallet<10?'（金币不足）':'');

    rb.onclick=()=>{

      const fromRun=Math.min(S.coinsRun,10); S.coinsRun-=fromRun; SAVE.coins-=10-fromRun; persist();
      S.refreshN=(S.refreshN||0)+1; S.choosing=false; ch.innerHTML=''; ov.classList.add('hidden');
      coinEl.textContent=SAVE.coins+S.coinsRun;
      levelUp(); };
    ch.appendChild(rb);
  }
  ov.classList.remove('hidden'); ov.classList.remove('menu');
}

let touch=null;
// ---- 摇杆式移动：手指第一次按下处为基点，拖动=方向，抬起重置 ----
let joy=null;
// 鼠标（桌面调试）：仅mouse指针
cv.addEventListener('pointerdown',e=>{ if(e.pointerType!=='mouse') return;
  const r=cv.getBoundingClientRect(); const s=W/r.width;
  joy={id:'mouse', bx:(e.clientX-r.left)*s, by:(e.clientY-r.top)*s, dx:0, dy:0}; });
cv.addEventListener('pointermove',e=>{ if(!joy||joy.id!=='mouse') return; const r=cv.getBoundingClientRect(); const s=W/r.width;
  const RMAX=55; let dx=(e.clientX-r.left)*s-joy.bx, dy=(e.clientY-r.top)*s-joy.by;
  const d=Math.hypot(dx,dy); if(d>RMAX){ dx=dx/d*RMAX; dy=dy/d*RMAX; }
  joy.dx=dx; joy.dy=dy; });
cv.addEventListener('pointerup',e=>{ if(joy&&joy.id==='mouse') joy=null; });
// 手机：按 touch identifier 追踪，第二根手指不影响摇杆
cv.addEventListener('touchstart',e=>{
  for(const t of e.changedTouches){ if(!joy){
    const r=cv.getBoundingClientRect(); const s=W/r.width;
    joy={id:t.identifier, bx:(t.clientX-r.left)*s, by:(t.clientY-r.top)*s, dx:0, dy:0}; } }
  if(e.cancelable) e.preventDefault();
},{passive:false});
cv.addEventListener('touchmove',e=>{
  if(!joy) return;
  for(const t of e.changedTouches){ if(t.identifier===joy.id){
    const r=cv.getBoundingClientRect(); const s=W/r.width;
    const RMAX=55; let dx=(t.clientX-r.left)*s-joy.bx, dy=(t.clientY-r.top)*s-joy.by;
    const dd2=Math.hypot(dx,dy); if(dd2>RMAX){ dx=dx/dd2*RMAX; dy=dy/dd2*RMAX; }
    joy.dx=dx; joy.dy=dy; } }
  if(e.cancelable) e.preventDefault();
},{passive:false});
const joyEnd=e=>{ if(!joy) return; for(const t of e.changedTouches){ if(t.identifier===joy.id) joy=null; } };
cv.addEventListener('touchend',joyEnd); cv.addEventListener('touchcancel',joyEnd);
// 多指时按钮 touch 直通：移动中点暂停/技能立即生效
const touchBtn=(el,fn)=>{ if(!el) return; el.addEventListener('touchstart',e=>{ e.preventDefault(); e.stopPropagation(); fn(); },{passive:false}); };

// ---------- loop ----------
let raf=null, lastT=0;
function loop(){ cancelAnimationFrame(raf); lastT=performance.now(); raf=requestAnimationFrame(frame); }
function frame(now){
  const dt=Math.min((now-lastT)/1000,0.05); lastT=now;
  if(S&&!S.over&&!S.choosing&&!S.paused) update(dt);
  draw();
  if(S&&!S.over) raf=requestAnimationFrame(frame);
}
function update(dt){
  S.t+=dt; S.walkT+=dt;
  if(S.stopT>0){ S.stopT-=dt; dt*=0.25; } // Boss击杀慢动作
  S.x=S.px; S.y=S.py; // keep dist(e,S) valid
  // move
  let dx=0,dy=0;
  if(keys['w']||keys['arrowup'])dy--; if(keys['s']||keys['arrowdown'])dy++;
  if(keys['a']||keys['arrowleft'])dx--; if(keys['d']||keys['arrowright'])dx++;
  if(joy&&(Math.abs(joy.dx)>5||Math.abs(joy.dy)>5)){ dx=joy.dx; dy=joy.dy; } // 摇杆方向=基点偏移，模拟量控制
  if(S.dashing>0){ dx=0; dy=0; } // 冲刺期间接管移动
  const l=Math.hypot(dx,dy)||1;
  const spd=115*(1+0.01*SAVE.up.spd)*(1+0.2*S.keys.spd)*(SAVE.char==='scholar'?0.9:1);
  S.px=Math.max(14,Math.min(WW-14,S.px+dx/l*spd*dt));
  S.py=Math.max(14,Math.min(WH-14,S.py+dy/l*spd*dt));
  S.moving=(dx||dy)?1:0;
  if(dx||dy) S.faceA=Math.atan2(dy,dx);
  // camera follows hero
  S.camx=Math.max(0,Math.min(WW-W,S.px-W/2));
  S.camy=Math.max(0,Math.min(WH-H,S.py-H/2));

  // auto fire
  S.fireT+=dt; S.muzzle=Math.max(0,(S.muzzle||0)-dt); S.swing=Math.max(0,(S.swing||0)-dt);
  if(S.fireT>=1/(fireRate()*weaponFireMul())){ S.fireT=0; fire(); }

  if(S.keys.orbit) S.orbitA+=dt*2.2;
  if(S.keys.nova){ S.novaT+=dt; if(S.novaT>=3.2-S.keys.nova*0.5){S.novaT=0; doNova();} }
  // ---- 多重弹第二排接力 ----
  if(S.volleyPending>0){ S.volleyT-=dt; if(S.volleyT<=0){ launchVolley(S.volleyPending); S.volleyPending=0; } }
  // ---- 荆棘领域：身边持续伤害 ----
  if(S.keys.thorn){ S.thornT-=dt;
    if(S.thornT<=0){ S.thornT=0.5; const tr=55+13*S.keys.thorn, td=playerDmg()*0.18*S.keys.thorn;
      for(const e of S.enemies){ if(e.dead)continue; if(dist(e,S)<tr){ e.hp-=td; e.hitT=0.06; if(e.hp<=0) killEnemy(e); } }
      S.parts.push({ring:true,x:S.px,y:S.py,r:tr*0.6,max:tr,life:0.35,maxlife:0.35,color:'#8fe08f'}); } }
  // ---- 护盾冷却 ----
  S.shieldT-=dt;
  // ---- 主动技能：冲刺 ----
  S.dashCd-=dt; S.dashInv-=dt;
  S.skillCd=Math.max(0,S.skillCd-dt); S.uberT=Math.max(0,S.uberT-dt); // 角色技能冷却/学者专注
  if(S.dashing>0){ S.dashing-=dt;
    const dashSp=(S.keys.warr||0)>0?760:560; // 斗士：冲刺更快
    S.px=Math.max(14,Math.min(WW-14,S.px+Math.cos(S.dashA)*dashSp*dt));
    S.py=Math.max(14,Math.min(WH-14,S.py+Math.sin(S.dashA)*dashSp*dt));
    S.moving=1;
    S.parts.push({x:S.px,y:S.py,vx:rand(-20,20),vy:rand(-20,20),life:0.3,color:'#9fe8f5',r:5});
  }

  // bullets
  for(const b of S.bullets){
    if(S.keys.homing){ // 追踪弹：按等级转向最近的敌人
      let tt=null, bd=300;
      for(const e of S.enemies){ if(e.dead)continue; const d2=dist(b,e); if(d2<bd){bd=d2;tt=e;} }
      if(tt){ const cur=Math.atan2(b.vy,b.vx), ta=Math.atan2(tt.y-b.y,tt.x-b.x);
        let df=ta-cur; while(df>Math.PI)df-=2*Math.PI; while(df<-Math.PI)df+=2*Math.PI;
        const turn=Math.min(Math.abs(df),(2.2+1.1*S.keys.homing)*dt), na=cur+Math.sign(df)*turn, sp=Math.hypot(b.vx,b.vy);
        b.vx=Math.cos(na)*sp; b.vy=Math.sin(na)*sp; }
    }
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    if(b.x<-20||b.x>WW+20||b.y<-20||b.y>WH+20) b.dead=true;
    for(const e of S.enemies){
      if(e.dead||b.hitset.has(e))continue;
      if(dist(b,e)<e.r+4){
        const crit=Math.random()<0.13*S.keys.crit || S.uberT>0;
        const base=b.dmg0!=null?b.dmg0:playerDmg()*(b.mul||1);
        const dnum=Math.round(base*(crit?2:1)*10)/10;
        AudioSys.sfx('hit');
        e.hp-=dnum; e.hitT=0.1;
        S.dnums.push({x:e.x+rand(-4,4), y:e.y-e.r-4, v:dnum, crit, life:0.7, vy:-40});
        const kb=e.type==='boss'?0:e.type==='tank'?4:9; // 击退（Boss免疫）
        const a2=Math.atan2(b.vy,b.vx);
        e.x+=Math.cos(a2)*kb; e.y+=Math.sin(a2)*kb;
        S.shake=Math.max(S.shake||0,2.5);
        hitFx(e);
        if((b.rocket||S.keys.blast)&&!b._ex){ // 爆破弹/火箭筒：命中爆炸，溅射周围
          b._ex=true; const lvlR=b.rocket?(S.keys.rktr||0):(S.keys.blast||0);
          const br=b.rocket?55*(1+0.15*lvlR):30+12*lvlR, bd2=playerDmg()*(b.rocket?1.15:(0.5+0.25*lvlR));
          S.parts.push({ring:true,x:e.x,y:e.y,r:0,max:br,life:0.3,maxlife:0.3,color:'#ff9a3c'});
          S.parts.push({ring:true,x:e.x,y:e.y,r:0,max:br*0.6,life:0.18,maxlife:0.18,color:'#ffe27a'});
          S.parts.push({flash:true,x:e.x,y:e.y,r:br*0.55,life:0.1,maxlife:0.1});
          for(let k=0;k<8;k++){ const fa=rand(0,6.28), fr=rand(br*0.5,br*1.1);
            S.parts.push({x:e.x+Math.cos(fa)*8,y:e.y+Math.sin(fa)*8,vx:Math.cos(fa)*fr*3.2,vy:Math.sin(fa)*fr*3.2,life:0.35,color:k%2?'#ffb428':'#ff7030',r:rand(2,3.5)}); }
          if(b.rocket&&S.keys.fire){ S.fires.push({x:e.x,y:e.y,r:br,life:2.4,tick:0,btick:Math.max(0.15,0.4/(1+0.25*S.keys.rate))}); } // 烈焰残留（燃烧频率随攻速提升）
          S.shake=Math.max(S.shake||0,4);
          for(const o of S.enemies){ if(o.dead||o===e)continue; if(dist(o,e)<br){ o.hp-=bd2; o.hitT=0.1; hitFx(o); if(o.hp<=0) killEnemy(o); } }
          b.dead=true;
        }
        b.hitset.add(e);
        if(!b.dead&&--b.pierce<0) b.dead=true;
        if(e.hp<=0) killEnemy(e);
        break;
      }
    }
  }
  S.bullets=S.bullets.filter(b=>!b.dead);

  // enemies walk slowly toward player
  for(const e of S.enemies){
    if(e.dead)continue;
    // ---- 射手：远程攻击 ----
    if(e.type==='shooter'){
      const dd=dist(e,S)||1;
      e.shootT-=dt;
      if(dd>240){ e.x+=(S.px-e.x)/dd*e.spd*dt; e.y+=(S.py-e.y)/dd*e.spd*dt; }
      else if(e.shootT<=0){ e.shootT=rand(2,3.2);
        const a=Math.atan2(S.py-e.y,S.px-e.x);
        S.ebullets.push({x:e.x,y:e.y,vx:Math.cos(a)*160,vy:Math.sin(a)*160,life:3.5,dmg:1});
        S.parts.push({x:e.x+Math.cos(a)*12,y:e.y+Math.sin(a)*12,vx:0,vy:0,life:0.1,color:'#9fe8f5',r:4});
      }
      e.hitT=Math.max(0,e.hitT-dt); e.slowT=Math.max(0,(e.slowT||0)-dt);
      if(dd<e.r+9 && S.hurtT<=0){ if(hurtHero(e.dmg)&&S.hp<=0){ gameOver(); return; } }
      continue;
    }
    // ---- 治疗师：后方游走，周期性给同伴回血 ----
    if(e.type==='healer'){
      const dd=dist(e,S)||1;
      if(dd>320){ e.x+=(S.px-e.x)/dd*e.spd*dt; e.y+=(S.py-e.y)/dd*e.spd*dt; }
      else if(dd<200){ e.x-=(S.px-e.x)/dd*e.spd*0.8*dt; e.y-=(S.py-e.y)/dd*e.spd*0.8*dt; }
      e.healT-=dt;
      if(e.healT<=0){ e.healT=3; let healed=false;
        for(const o of S.enemies){ if(o!==e&&!o.dead&&o.type!=='boss'&&dist(o,e)<130&&o.hp<o.maxhp){ o.hp=Math.min(o.maxhp,o.hp+1.5); healed=true; } }
        if(healed) S.parts.push({ring:true,x:e.x,y:e.y,r:0,max:130,life:0.5,maxlife:0.5,color:'#ff9fd0'});
      }
      e.hitT=Math.max(0,e.hitT-dt); e.slowT=Math.max(0,(e.slowT||0)-dt);
      if(dd<e.r+9 && S.hurtT<=0){ if(hurtHero(e.dmg)&&S.hp<=0){ gameOver(); return; } }
      continue;
    }
    // 惩罚者弹幕
    if(e.bossType==='pun'){

      const rage2=e.hp<e.maxhp/2;
      if(e.barrageT>=e.barrageNext){
        e.barrageT=0; e.barrageNext=rage2?rand(3,5):rand(4,6);
        const n=rage2?14:8; // 二阶段弹幕更多
        const baseA=Math.atan2(S.py-e.y,S.px-e.x);
        for(let i=0;i<n;i++){
          const a=baseA+rand(-Math.PI*0.9,Math.PI*0.9);
          S.ebullets.push({x:e.x,y:e.y,vx:Math.cos(a)*rand(100,145),vy:Math.sin(a)*rand(100,145),life:4.5,dmg:2});
        }
        e.hitT=0.1;
      }
    }
    // 死灵领主：召唤亡灵小怪
    if(e.bossType==='necro'){
      e.summonT=(e.summonT===undefined?6:e.summonT)-dt;
      if(e.summonT<=0){ e.summonT=e.hp<e.maxhp/2?5:8;
        const SUMMON_TYPES=[ // 任意小怪随机召唤
          {type:'runner',color:'#e8a33d',dark:'#a86a20',spd:110,r:9, dmg:1},
          {type:'tank',  color:'#d05a4e',dark:'#8a3a32',spd:38, r:15,dmg:2},
          {type:'shooter',color:'#4fc3d9',dark:'#2f8fa8',spd:45,r:11,dmg:1},
          {type:'splitter',color:'#e0c04c',dark:'#a88a2c',spd:55,r:12,dmg:1},
          {type:'healer', color:'#e87bb0',dark:'#a84a78',spd:50,r:10,dmg:1},
          {type:'mini',   color:'#8a7bd0',dark:'#5a4aa0',spd:60,r:9, dmg:1}];
        for(let i=0;i<2;i++){ const aa=rand(0,Math.PI*2); const T=SUMMON_TYPES[Math.random()*SUMMON_TYPES.length|0];
          S.enemies.push({x:e.x+Math.cos(aa)*40,y:e.y+Math.sin(aa)*40,hp:(T.type==='tank'?8:4)*S.mul,maxhp:(T.type==='tank'?8:4)*S.mul,spd:T.spd*rand(0.9,1.1),r:T.r,dmg:T.dmg,color:T.color,dark:T.dark,xp:2,type:T.type,hitT:0,dead:false,wob:Math.random()*6}); }
        S.texts.push({txt:'☠️「'+e.bossName+'」召唤'+({runner:'疾跑者',tank:'重甲怪',shooter:'射手',splitter:'分裂怪',healer:'治疗怪',mini:'亡灵'}[S.enemies[S.enemies.length-1].type]||'亡灵')+'！', life:1.5});
      }
    }
    // 球球冲刺技能（死灵领主不会冲刺，只会召唤）
    if(e.bossType==='qq'){
      if(e.dashT>0){ // 冲刺中：快速位移 + 碰撞仍生效
        e.dashT-=dt;
        e.x+=Math.cos(e.dashA)*520*dt;
        e.y+=Math.sin(e.dashA)*520*dt;
        e.x=Math.max(30,Math.min(WW-30,e.x)); e.y=Math.max(30,Math.min(WH-30,e.y));
        e.hitT=0.05;
        if(Math.hypot(e.x-S.px,e.y-S.py)<e.r+9 && S.hurtT<=0){
          if(hurtHero(e.dmg)){ S.shake=Math.max(S.shake,5);
          if(S.hp<=0){ gameOver(); return; } }
        }
        continue; // 冲刺时不受常规移动影响
      }
      if(e.tele>0){ // 预警锁定方向，原地不动
        e.tele-=dt;
        if(e.tele<=0){ e.dashT=0.55; e.dashA=e.teleA; S.shake=Math.max(S.shake||0,3); }
        continue;
      }
      const rage=e.hp<e.maxhp/2;
      if(rage&&!e.raged){ e.raged=true; S.texts.push({txt:'😈「'+e.bossName+'」进入狂暴！', life:2}); }
      e.chargeT+=dt;
      const qqQ=e.bossType==='qq'?0.3:0; // 球球：预警与冷却各减0.3s
      if(e.chargeT>=(rage?4-qqQ:6-qqQ)){ e.chargeT=0; e.tele=rage?1.2-qqQ:2-qqQ; e.teleA=Math.atan2(S.py-e.y,S.px-e.x); } // 狂暴：冷却3.7s/预警0.9s
    }
    const d=dist(e,S)||1;
    const es=e.spd*(e.slowT>0?(0.55-0.25*(S.keys.tslow||0)):1);
    e.x+=(S.px-e.x)/d*es*dt;
    e.y+=(S.py-e.y)/d*es*dt;
    e.hitT=Math.max(0,e.hitT-dt);
    e.slowT=Math.max(0,(e.slowT||0)-dt);
    if(d<e.r+9 && S.hurtT<=0 && hurtHero(e.dmg)){
      S.shake=Math.max(S.shake||0,4);
      const a3=Math.atan2(e.y-S.py,e.x-S.px);
      e.x+=Math.cos(a3)*30; e.y+=Math.sin(a3)*30; // 怪物被击退（更远，给玩家喘息空间）
      if(S.hp<=0){ gameOver(); return; }
    }
  }
  // 怪物相互挤压：软性分离，防止重叠
  const ens=S.enemies;
  for(let i=0;i<ens.length;i++){
    const a=ens[i]; if(a.dead)continue;
    for(let j=i+1;j<ens.length;j++){
      const b2=ens[j]; if(b2.dead)continue;
      const dx=b2.x-a.x, dy=b2.y-a.y;
      const min=a.r+b2.r, d2=dx*dx+dy*dy;
      if(d2>0 && d2<min*min){
        const d=Math.sqrt(d2), ov=(min-d)*0.5;
        const nx=dx/d, ny=dy/d;
        const wa=a.type==='boss'?0.1:1, wb=b2.type==='boss'?0.1:1; // boss几乎不动
        a.x-=nx*ov*wa; a.y-=ny*ov*wa;
        b2.x+=nx*ov*wb; b2.y+=ny*ov*wb;
      }
    }
  }
  // orbit blades
  if(S.keys.orbit){
    const R=46,n=S.keys.orbit;
    for(let i=0;i<n;i++){
      const a=S.orbitA+i*Math.PI*2/n;
      const bx=S.px+Math.cos(a)*R, by=S.py+Math.sin(a)*R;
      for(const e of S.enemies){
        if(e.dead)continue;
        if(Math.hypot(e.x-bx,e.y-by)<e.r+7&&!e.orbT){ e.hp-=playerDmg()*0.8; e.orbT=0.4; e.hitT=0.1; hitFx(e); if(e.hp<=0)killEnemy(e); }
      }
    }
  }
  for(const e of S.enemies) if(e.orbT) e.orbT=Math.max(0,e.orbT-dt);
  S.enemies=S.enemies.filter(e=>!e.dead);

  // \u5e03\u9632\u9053\u5177
  for(const dfn of S.defs){
    if(dfn.temp){ dfn.life-=dt; } // 工程师临时炮台倒计时
    if(dfn.id==='turret'){
      dfn.cd-=dt;
      if(dfn.cd<=0){
        let tgt=null,bd=280;
        for(const e of S.enemies){ const dd=dist(e,dfn); if(dd<bd){bd=dd;tgt=e;} }
        if(tgt){ dfn.ang=Math.atan2(tgt.y-dfn.y,tgt.x-dfn.x);
          const tDmg=dfn.temp?playerDmg()*(1+0.5*S.keys.tdmg):(0.5*(1+0.5*S.keys.tdmg))*(SAVE.char==='engineer'?1.45:1); // 临时炮台伤害1×且受火力卡影响；工程师布防炮台+45%
          S.bullets.push({x:dfn.x,y:dfn.y,vx:Math.cos(dfn.ang)*420,vy:Math.sin(dfn.ang)*420,life:1.2,pierce:0,hitset:new Set(),dmg0:tDmg});
          dfn.cd=(dfn.temp?0.8/(1+0.2*S.keys.trate):0.8/(1+0.2*S.keys.trate))/(dfn.temp?2:1)/((SAVE.char==='engineer'&&!dfn.temp)?1.3:1); }
      }
    } else if(dfn.id==='spike'){
      const sR=120*(1+0.4*(S.keys.tspike||0)); // 尖刺扩容：范围+40%/级
      dfn.cd-=dt;
      if(dfn.cd<=0){ let hitAny=false;        for(const e of S.enemies){ if(dist(e,dfn)<sR){ e.hp-=playerDmg()*0.35; e.hitT=0.1; hitFx(e); S.dnums.push({x:e.x+rand(-4,4),y:e.y-e.r-4,v:Math.round(playerDmg()*0.35*10)/10,crit:false,life:0.7,vy:-40}); if(e.hp<=0)killEnemy(e); hitAny=true; } }
        if(hitAny) S.parts.push({ring:true,x:dfn.x,y:dfn.y,r:0,max:sR,life:0.25,maxlife:0.25});
        dfn.cd=0.5; }
    } else if(dfn.id==='totem'){
      dfn.cd-=dt;
      if(dfn.cd<=0 && dist(dfn,S)<150 && S.hp<S.maxhp){ S.hp=Math.min(S.maxhp,S.hp+1); S.parts.push({ring:true,x:S.px,y:S.py,r:0,max:40,life:0.4,maxlife:0.4}); dfn.cd=9-2*(S.keys.theal||0); }
    } else if(dfn.id==='slow'){
      const slowMul=0.55-0.25*(S.keys.tslow||0); // 极寒之力：45%→70%减速
      for(const e of S.enemies){ if(dist(e,dfn)<150) e.slowT=0.35; }
      dfn.slowMul=slowMul; }
  }
  S.defs=S.defs.filter(d=>!(d.temp&&d.life<=0)); // 工程师临时炮台到期拆除
  // 烈焰残留火圈
  for(const f of S.fires){ f.life-=dt; f.tick-=dt;
    if(f.tick<=0){ f.tick=f.btick||0.4;
      for(const e of S.enemies){ if(e.dead)continue;
        if(dist(e,f)<f.r){ e.hp-=0.7*S.keys.fire; e.hitT=Math.max(e.hitT,0.05);
          S.dnums.push({x:e.x+rand(-4,4),y:e.y-e.r-4,v:0.7*S.keys.fire,crit:false,life:0.6,vy:-30});
          if(e.hp<=0) killEnemy(e); } } } }
  S.fires=S.fires.filter(f=>f.life>0);
  // gems
  const mag=60*(1+0.4*S.keys.magnet);
  for(const g of S.gems){
    const d=dist(g,S);
    if(d<mag){const l2=d||1; g.x+=(S.px-g.x)/l2*230*dt; g.y+=(S.py-g.y)/l2*230*dt;}
    if(d<14){g.dead=true; gainXP(g.v);}
  }
  S.gems=S.gems.filter(g=>!g.dead);
  // boss弹幕
  for(const b of S.ebullets){
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    if(b.life<=0||b.x<-30||b.x>WW+30||b.y<-30||b.y>WH+30){b.dead=true;continue;}
    if(Math.hypot(b.x-S.px,b.y-S.py)<12 && S.hurtT<=0){
      if(hurtHero(b.dmg)) S.shake=Math.max(S.shake,3);
      b.dead=true;
      if(S.hp<=0){ gameOver(); return; }
    }
  }
  S.ebullets=S.ebullets.filter(b=>!b.dead);
  // coins
  for(const c of S.coins){
    const d=Math.hypot(c.x-S.px,c.y-S.py);
    if(d<mag*1.2){const l2=d||1; c.x+=(S.px-c.x)/l2*230*dt; c.y+=(S.py-c.y)/l2*230*dt;}
    if(d<14){c.dead=true; S.coinsRun+=c.v; AudioSys.sfx('coin');
      if(SAVE.daily){ SAVE.daily.coins+=c.v; persist(); }}
  }
  S.coins=S.coins.filter(c=>!c.dead);

  for(const p of S.parts){ p.life-=dt; if(p.ring){p.r+=dt*p.max/p.maxlife;} else{ if(p.vx){p.x+=p.vx*dt; p.y+=p.vy*dt;} } } // 无速度的粒子(挥砍弧光)原地渐隐
  S.parts=S.parts.filter(p=>p.life>0);
  for(const t of S.texts)t.life-=dt;
  S.texts=S.texts.filter(t=>t.life>0);
  S.hurtT=Math.max(0,S.hurtT-dt);
  S.comboT=Math.max(0,(S.comboT||0)-dt); if(S.comboT<=0) S.combo=0; // 连击窗口
  if(S.pendComplete&&!S.over&&!S.choosing&&S.t-(S.pendAt||0)>=1.2){ S.pendComplete=false; levelComplete(); return; } // Boss击杀延迟结算
  S.redT=Math.max(0,(S.redT||0)-dt);
  for(const n of S.dnums){ n.life-=dt; n.y+=n.vy*dt; n.vy*=0.92; }
  S.dnums=S.dnums.filter(n=>n.life>0);
  const pb=S.enemies.find(e=>e.bossType==='pun');
  S.dbg={fps:Math.round(1/Math.max(dt,0.001)), n:S.enemies.length, spd:S.enemies.length?S.enemies[0].spd.toFixed(1):'-', b:S.bullets.length,
         eb:S.ebullets.length, bt:pb?pb.barrageT.toFixed(1)+'/'+pb.barrageNext.toFixed(1):'-'};

  // slow spawning: interval grows slightly with time, count small
  S.spawnTimer-=dt;
  if(S.test) S.spawnTimer=999;
  if(!S.test && S.spawnTimer<=0){
    S.spawnTimer=Math.max(0.9, 1.8-S.t*0.002);
    const CAP=45; // 同屏刷怪上限（性能+可读性）
    if(S.enemies.length<CAP) spawnEnemy();
    if(S.t>40 && S.enemies.length<CAP && Math.random()<0.4) spawnEnemy();
    if(S.t>120 && S.enemies.length<CAP && Math.random()<0.4) spawnEnemy();
  }
  if(!S.test&&!S.airDone&&S.bossCount===0&&S.t>=S.nextBossAt-5&&S.t<S.nextBossAt){ // 飞行器倒计时
    const sec=Math.ceil(S.nextBossAt-S.t);
    if(S._acSec!==sec){ S._acSec=sec; S.texts.push({txt:'🚁 空中商店 '+sec+' 秒后到达...', life:1}); }
  }
  if((S.t>=S.nextBossAt||S.test)&&S.bossCount===0){
    if(S.test||S.airDone) spawnBoss();
    else { S.airBuyN=0; S.airBought={}; openAirshop(); } // 自动到达的商店：重置限购（购买后重建商店不清零）
  }
  // Boss 超时 3 分钟离开
  if(S.bossCount>0 && S.t-S.bossSpawnAt>=180){
    S.enemies=S.enemies.filter(e=>e.type!=='boss');
    S.bossCount=0; S.nextBossAt=S.t+(S.rushMode?3:150);
    S.texts.push({txt:'💨 BOSS 失去兴趣离开了', life:2.5});
  }

  // HUD
  hpEl.textContent=Math.max(0,Math.ceil(S.hp))+'/'+S.maxhp;
  dashBtn.textContent=(SAVE.char==='scholar'?'📖':SAVE.char==='merchant'?'🛒':SAVE.char==='engineer'?'🔧':'⚡')+(S.skillCd>0?Math.ceil(S.skillCd):''); dashBtn.style.opacity=S.skillCd>0?0.55:1; // 角色技能冷却显示
  coinEl.textContent=SAVE.coins+S.coinsRun;
  const m=Math.floor(S.t/60), s=Math.floor(S.t%60);
  tEl.textContent=m+':'+String(s).padStart(2,'0');
  xpEl.style.height=Math.min(100,S.xp/S.xpNext*100)+'%';
  xpEl.title='';
  xpNextEl.textContent=Math.ceil(S.xp)+'/'+S.xpNext;
  if(SAVE.stats && S.kills>SAVE.stats.best) SAVE.stats.best=S.kills;
  if(SAVE.daily && Math.floor(S.t)>SAVE.daily.secs){ SAVE.daily.secs=Math.floor(S.t); persist(); }
}
function openAirshop(){
  S.paused=true; S.airDone=true; // airBuyN 由打开商店的调用方重置（购买后重建商店不清零）
  // 飞行器清扫主角身边一小圈怪物（Boss 不受影响；范围已缩小）
  let cleared=0;
  for(const e of S.enemies){ if(e.type!=='boss'&&!e.dead&&dist(e,S)<90){ e.dead=true; cleared++; } }
  S.enemies=S.enemies.filter(e=>!e.dead);
  if(cleared) S.parts.push({ring:true,x:S.px,y:S.py,r:0,max:90,life:0.4,maxlife:0.4});
  S.texts.push({txt:'🚁 空中商店抵达'+(cleared?'，清扫了 '+cleared+' 只怪物':''), life:1.5});
  ovT.textContent='🚁 空中商店';
  ovX.innerHTML='金币：<b>'+(SAVE.coins+S.coinsRun)+'</b>（含本局拾取 '+S.coinsRun+'；购买的道具立即布置在主角身边）';
  ch.innerHTML='';
  const total=()=>SAVE.coins+S.coinsRun; // 合并钱包：存款+本局拾取
  const spend=(n)=>{ const fromRun=Math.min(S.coinsRun,n); S.coinsRun-=fromRun; SAVE.coins-=n-fromRun; persist(); };
  for(const it of DEF_ITEMS){
    const c=document.createElement('div'); c.className='card rd';
    c.innerHTML='<div class="ic">'+it.ic+'</div><div class="nm">'+it.nm+'</div><div class="ds">'+it.ds+'</div><div class="lv">💰 '+it.cost+' 购买</div>';
    const itemCap=()=>((S.airBought||{})[it.id]||0)>=2; // 每个道具本局最多从商店买2次（只计商店购买，不含战前布防）
    if(total()<it.cost){ c.style.opacity=.5;
      c.onclick=()=>{ ovT.textContent='⚠️ 金币不足（需要 '+it.cost+'）'; setTimeout(()=>{ovT.textContent='🚁 空中商店';},900); };
    } else if(itemCap()){ c.style.opacity=.5;
      c.onclick=()=>{ ovT.textContent='⚠️ 每个道具最多购买2次'; setTimeout(()=>{ovT.textContent='🚁 空中商店';},1100); };
    } else c.onclick=()=>{ if((S.airBuyN||0)>=3){ ovT.textContent='⚠️ 本次空运最多购买 3 件'; setTimeout(()=>{ovT.textContent='🚁 空中商店';},1100); return; } if(total()<it.cost||itemCap())return;
      spend(it.cost); S.airBuyN=(S.airBuyN||0)+1; S.airBought=S.airBought||{}; S.airBought[it.id]=(S.airBought[it.id]||0)+1; // 限购计数（按道具）
      const a2=rand(0,Math.PI*2);
      S.defs.push({id:it.id,x:Math.max(40,Math.min(WW-40,S.px+Math.cos(a2)*80)),y:Math.max(40,Math.min(WH-40,S.py+Math.sin(a2)*80)),cd:0,ang:0});
      openAirshop(); };
    ch.appendChild(c);
  }
  const b1=document.createElement('div'); b1.className='card';
  b1.innerHTML='<div class="ic">🔥</div><div class="nm">战斗狂热</div><div class="ds">本场伤害 +50%</div><div class="lv">💰 25 购买</div>';
  if(total()<25||S.runDmg>1) b1.style.opacity=.5;
  b1.onclick=()=>{ if(total()<25||S.runDmg>1)return; spend(25); S.runDmg=1.5; openAirshop(); };
  ch.appendChild(b1);
  const b2=document.createElement('div'); b2.className='card';
  b2.innerHTML='<div class="ic">💚</div><div class="nm">战地医疗</div><div class="ds">生命回满</div><div class="lv">💰 20 购买</div>';
  if(total()<20||S.hp>=S.maxhp) b2.style.opacity=.5;
  b2.onclick=()=>{ if(total()<20||S.hp>=S.maxhp)return; spend(20); S.hp=S.maxhp; openAirshop(); };
  ch.appendChild(b2);
  const go=document.createElement('button'); go.textContent='🚀 起飞返回战场';
  go.onclick=()=>{ S.paused=false; S.airBuyN=0; ov.classList.add('hidden'); ov.classList.remove('menu'); }; // 起飞=本次空运结束, 重置限购
  ch.appendChild(go);
  ov.classList.remove('hidden');
}
function gameOver(){
  S.over=true; pauseBtn.classList.add('hidden'); dashBtn.classList.add('hidden');
  AudioSys.stopMusic();
  // ---- 复活广告点：每局一次，死亡瞬间出现（最强广告场景） ----
  if(!S.revived){
    ch.innerHTML='';
    ovT.textContent='💀 倒在了第 '+Math.floor(S.t)+' 秒';
    ovX.innerHTML='击杀 '+S.kills+' · 等级 '+S.lvl+' · 已积累金币 '+S.coinsRun+'<br><br><b style="color:#ffd76a">满血复活，本局继续！</b><br><span style="font-size:11px;color:#7285a8">每局限 1 次</span>';
    const rv=document.createElement('button'); rv.textContent='💖 满血复活（每局1次）';
    rv.onclick=()=>doRevive();
    ch.appendChild(rv);
    const gv=document.createElement('button'); gv.textContent='🏃 放弃，去结算'; gv.style.background='#888'; gv.style.color='#fff';
    gv.onclick=()=>showDeathResults();
    ch.appendChild(gv);
    ov.classList.remove('hidden');
    return;
  }
  showDeathResults();
}
function doRevive(){
  S.over=false; S.revived=true; S.hp=S.maxhp; S.hurtT=1.2; S.redT=0;
  // 复活时把主角身边的怪推开一圈，给玩家喘息
  for(const e of S.enemies){ if(e.type!=='boss'){ const a=Math.atan2(e.y-S.py,e.x-S.px); const d=Math.hypot(e.x-S.px,e.y-S.py)||1; const push=Math.max(0,220-d); e.x+=Math.cos(a)*push; e.y+=Math.sin(a)*push; } }
  S.texts.push({txt:'✨ 复活！继续战斗！', life:2});
  ch.innerHTML=''; ov.classList.add('hidden'); ov.classList.remove('menu'); pauseBtn.classList.remove('hidden'); dashBtn.classList.remove('hidden'); // 恢复暂停/冲刺按钮（Bug3）
  AudioSys.startMusic(false);
  loop();
}
function showDeathResults(){
  const bonus=Math.min(150, Math.floor(S.t)*1);
  const got=S.coinsRun+bonus;
  SAVE.coins+=got;
  SAVE.defense[selLevel]=[]; persist(); // 清空场上道具
  S._got=got; S._paid=false;
  ovT.textContent='💀 倒在了第 '+Math.floor(S.t)+' 秒';
  ovX.innerHTML='击杀 <b>'+S.kills+'</b> · 等级 <b>'+S.lvl+'</b> · 金币 +<b id="resCoins">0</b>（现共 '+SAVE.coins+'）';
  ch.innerHTML='';
  const hb=document.createElement('button'); hb.textContent='🏠 返回主页'; hb.style.background='#888'; hb.onclick=()=>showPage('home'); ch.appendChild(hb);
  const rb=document.createElement('button'); rb.textContent='🔁 再战第'+selLevel+'关'; rb.onclick=()=>startLevel(); ch.appendChild(rb);
  playResultAnim(got);
  ov.classList.remove('hidden');
}
function playResultAnim(got){ // 结算动画：标题弹出 + 内容逐条浮现 + 金币滚动
  ovT.classList.remove('res-pop'); void ovT.offsetWidth; ovT.classList.add('res-pop');
  [...ch.children].forEach((el,i)=>{ el.classList.remove('res-rise'); void el.offsetWidth; el.classList.add('res-rise'); el.style.animationDelay=(0.2+i*0.12)+'s'; });
  const coinEl2=document.getElementById('resCoins');
  if(coinEl2&&got>0){ const t0=performance.now(), dur=800;
    const tick=n=>{ const p=Math.min(1,(n-t0)/dur), ease=1-Math.pow(1-p,3);
      coinEl2.textContent='+'+Math.round(got*ease);
      if(p<1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick); }
}

// ---------- drawing ----------
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0); // 物理分辨率放大，逻辑坐标不变（抗糊）
  if(S&&S.shake>0){ ctx.save(); ctx.translate(rand(-S.shake,S.shake),rand(-S.shake,S.shake)); S.shake*=0.85; if(S.shake<0.3)S.shake=0; }
  ctx.fillStyle='#10151f'; ctx.fillRect(-30,-30,W+60,H+60);
  if(!S){ ctx.font='bold 11px monospace'; ctx.textAlign='left'; ctx.fillStyle='rgba(255,255,255,.25)'; ctx.fillText('V24', 8, H-8); if(S&&S.shake>0)ctx.restore(); return; }
  ctx.save(); ctx.translate(-S.camx,-S.camy);
  const bg=ctx.createRadialGradient(WW/2,WH/2,WH*0.3,WW/2,WH/2,WW*0.75);
  bg.addColorStop(0,'#221c3f'); bg.addColorStop(0.6,'#171433'); bg.addColorStop(1,'#0c0a20');
  ctx.fillStyle=bg; ctx.fillRect(0,0,WW,WH);
  if(!S.stars) S.stars=[...Array(90)].map(()=>({x:rand(0,WW),y:rand(0,WH),r:rand(0.7,1.8),ph:rand(0,6)}));
  for(const st of S.stars){ const sa=0.18+0.16*Math.sin(S.t*2+st.ph);
    ctx.fillStyle='rgba(205,220,255,'+sa.toFixed(2)+')'; ctx.fillRect(st.x,st.y,st.r,st.r); }
  ctx.fillStyle='rgba(120,80,200,.06)'; // 远山剪影层次
  ctx.fillRect(0,0,WW,WH*0.18);
  ctx.strokeStyle='rgba(255,255,255,.04)'; ctx.lineWidth=1;
  for(let x=Math.floor(S.camx/40)*40; x<S.camx+W+40; x+=40){ctx.beginPath();ctx.moveTo(x,S.camy);ctx.lineTo(x,S.camy+H);ctx.stroke();}
  for(let y=Math.floor(S.camy/40)*40; y<S.camy+H+40; y+=40){ctx.beginPath();ctx.moveTo(S.camx,y);ctx.lineTo(S.camx+W,y);ctx.stroke();}
  if(S.decor) for(const d2 of S.decor){ // 地面装饰：草丛/石块/裂纹/小花
    const sw=Math.sin(S.t*2+d2.ph)*1.5;
    ctx.save(); ctx.translate(d2.x,d2.y); ctx.scale(d2.s,d2.s);
    if(d2.t==='grass'){ ctx.strokeStyle='rgba(80,160,90,.5)'; ctx.lineWidth=2; ctx.lineCap='round';
      for(let k=-1;k<=1;k++){ ctx.beginPath(); ctx.moveTo(k*3,4); ctx.quadraticCurveTo(k*4+sw,-2,k*5+sw,-7); ctx.stroke(); } ctx.lineCap='butt'; }
    else if(d2.t==='stone'){ ctx.fillStyle='rgba(70,84,110,.55)'; ctx.beginPath();
      ctx.moveTo(-7,3); ctx.lineTo(-4,-5); ctx.lineTo(3,-6); ctx.lineTo(7,1); ctx.lineTo(4,5); ctx.lineTo(-4,5); ctx.closePath(); ctx.fill();
      ctx.fillStyle='rgba(120,136,168,.4)'; ctx.fillRect(-4,-5,7,3); }
    else if(d2.t==='crack'){ ctx.strokeStyle='rgba(20,26,40,.7)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(-8,0); ctx.lineTo(-2,-3); ctx.lineTo(3,1); ctx.lineTo(8,-2); ctx.moveTo(-2,-3); ctx.lineTo(-1,4); ctx.stroke(); }
    else { const fl=Math.sin(S.t*3+d2.ph)>0?'#e8a0c8':'#f2d76a';
      for(let k=0;k<5;k++){ const a2=k*1.257+d2.rot; ctx.fillStyle=fl; ctx.beginPath(); ctx.arc(Math.cos(a2)*3,Math.sin(a2)*3,2,0,7); ctx.fill(); }
      ctx.fillStyle='#fff3c0'; ctx.beginPath(); ctx.arc(0,0,1.8,0,7); ctx.fill(); }
    ctx.restore(); }
  ctx.strokeStyle='#3fa9f5'; ctx.lineWidth=6; ctx.setLineDash([16,10]);
  ctx.strokeRect(3,3,WW-6,WH-6); ctx.setLineDash([]);
  ctx.fillStyle='rgba(63,169,245,.12)';
  ctx.fillRect(0,0,WW,14); ctx.fillRect(0,WH-14,WW,14); ctx.fillRect(0,0,14,WH); ctx.fillRect(WW-14,0,14,WH);
for(const g of S.gems){

  // boss弹幕绘制（紫色发光弹）
  for(const b of S.ebullets){
    ctx.fillStyle='rgba(224,96,155,.28)'; ctx.beginPath(); ctx.arc(b.x,b.y,12,0,7); ctx.fill();
    ctx.fillStyle='#e0609b'; ctx.beginPath(); ctx.arc(b.x,b.y,7,0,7); ctx.fill();
    ctx.fillStyle='#ffe0ef'; ctx.beginPath(); ctx.arc(b.x-2,b.y-2,3,0,7); ctx.fill();
  }
  for(const b of S.bullets){
    ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(Math.atan2(b.vy,b.vx));
    if(b.rocket){ ctx.fillStyle='#ffb428'; ctx.beginPath(); ctx.arc(0,0,6,0,7); ctx.fill();
      ctx.fillStyle='#ffe27a'; ctx.fillRect(-12,-2,8,4); }
    else { ctx.fillStyle='#ffe27a'; ctx.fillRect(-5,-2,10,4);
    ctx.fillStyle='#fff'; ctx.fillRect(1,-1.5,4,3); }
    ctx.restore();
  }
  // 烈焰残留火圈绘制
  for(const f of S.fires){
    const a2=Math.min(1,f.life/2.4);
    const fl=1+Math.sin(f.life*22+f.x)*0.06; // 火焰闪烁
    ctx.fillStyle='rgba(255,110,30,'+(0.16*a2).toFixed(2)+')';
    ctx.beginPath(); ctx.arc(f.x,f.y,f.r*fl,0,7); ctx.fill();
    ctx.strokeStyle='rgba(255,160,40,'+(0.55*a2).toFixed(2)+')'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(f.x,f.y,f.r*fl,0,7); ctx.stroke(); ctx.lineWidth=1;
    for(let i=0;i<3;i++){ const fa=Math.random()*7, fr=Math.random()*f.r*0.5;
      ctx.fillStyle='rgba(255,200,60,'+(0.4*a2*Math.random()).toFixed(2)+')';
      ctx.fillRect(f.x+Math.cos(fa)*fr-1.5, f.y+Math.sin(fa)*fr-1.5, 3,3); }
  }
  for(const p of S.parts){
    if(p.slash&&p.sweep){ const prog=1-Math.max(0,p.life/p.maxlife); // 刀光：单道白色斩击楔形（不是同心弧，避免"WiFi"观感）
      const a1=p.a-p.arc/2, cur=a1+p.arc*prog, span=Math.min(p.arc,p.arc*Math.max(0.2,prog*1.05));
      const fade=Math.max(0,1-prog*0.6);
      // 一道锋利的楔形斩击（外弧满半径、内弧收得很窄 → 读起来像刀锋扫过而不是圆环）
      ctx.shadowColor='rgba(180,215,255,.8)'; ctx.shadowBlur=8;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,cur-span,cur);
      ctx.arc(p.x,p.y,p.r*0.35,cur,cur-span,true);
      ctx.closePath();
      ctx.fillStyle='rgba(225,240,255,'+(0.55*fade).toFixed(2)+')'; ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,'+(0.9*fade).toFixed(2)+')'; ctx.lineWidth=2.5; ctx.stroke();
      ctx.shadowBlur=0;
      // 前锋亮线（直线感，沿最新扫过的一段）
      ctx.strokeStyle='rgba(255,255,255,'+(0.95*fade).toFixed(2)+')'; ctx.lineWidth=3.5; ctx.lineCap='round';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*0.98,Math.max(cur-span,cur-0.45),cur); ctx.stroke();
      ctx.lineCap='butt';
      // 斩击线（2条快速直线掠过，冷白蓝）
      for(let k=0;k<2;k++){ const la=cur-span*(0.3+k*0.35);
        ctx.strokeStyle='rgba(190,220,255,'+(0.5*fade).toFixed(2)+')'; ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(p.x+Math.cos(la)*p.r*0.45, p.y+Math.sin(la)*p.r*0.45);
        ctx.lineTo(p.x+Math.cos(la)*p.r*1.05, p.y+Math.sin(la)*p.r*1.05); ctx.stroke(); }
      // 冷色火花
      for(let k=0;k<4;k++){ const sa=cur+rand(-0.2,0.2), sr=p.r*rand(0.85,1.1);
        ctx.fillStyle='rgba(200,225,255,'+(0.8*fade).toFixed(2)+')';
        ctx.fillRect(p.x+Math.cos(sa)*sr-1.5, p.y+Math.sin(sa)*sr-1.5, 3,3); }
      ctx.lineWidth=1; }
    else if(p.shard){ const a2=Math.max(0,p.life/p.maxlife);
      ctx.strokeStyle='rgba(210,230,255,'+(a2*0.9).toFixed(2)+')'; ctx.lineWidth=1.8;
      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-p.vx*0.03,p.y-p.vy*0.03); ctx.stroke(); } // 碎片拉丝
    else if(p.flash){ const a2=Math.max(0,p.life/p.maxlife);
      ctx.fillStyle='rgba(255,255,240,'+(a2*0.85).toFixed(2)+')'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(1.2-a2*0.4),0,7); ctx.fill(); }
    else if(p.ring){ const c2=p.color||'#ffd76a', a2=Math.max(0,p.life/p.maxlife);
      ctx.strokeStyle='rgba('+parseInt(c2.slice(1,3),16)+','+parseInt(c2.slice(3,5),16)+','+parseInt(c2.slice(5,7),16)+','+a2+')';
      ctx.lineWidth=3; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.stroke(); }
    else { ctx.globalAlpha=Math.max(0,p.life/0.45); ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); ctx.globalAlpha=1; }
  }
  ctx.textAlign='center';
  for(const n of S.dnums){
    ctx.font=(n.crit?'bold 17px':'bold 12px')+' monospace';
    ctx.fillStyle=n.crit?'#ff9d3c':'#ffffff';
    ctx.globalAlpha=Math.min(1,n.life/0.3);
    ctx.fillText(n.crit?n.v+'!':''+n.v, n.x, n.y);
    ctx.globalAlpha=1;
  }
  drawHero();
  ctx.restore();
  ctx.font='bold 20px sans-serif'; ctx.textAlign='center';
  // 画面四角暗角（氛围）
  const vg=ctx.createRadialGradient(W/2,H/2,H*0.42,W/2,H/2,H*0.78);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.38)');
  ctx.fillStyle=vg; ctx.fillRect(-30,-30,W+60,H+60);
  if(joy&&S&&!S.over){ // 摇杆可视化：基点圈+摇杆头
    ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(joy.bx,joy.by,55,0,7); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.25)'; ctx.beginPath(); ctx.arc(joy.bx,joy.by,55,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.5)'; ctx.beginPath(); ctx.arc(joy.bx+joy.dx,joy.by+joy.dy,22,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.8)'; ctx.beginPath(); ctx.arc(joy.bx+joy.dx,joy.by+joy.dy,13,0,7); ctx.fill();
  }
  S.texts.forEach((t,i)=>{ ctx.globalAlpha=Math.min(1,t.life); ctx.fillStyle='#ffd76a'; ctx.fillText(t.txt,W/2,H/2-50-i*26); ctx.globalAlpha=1; });
  if((S.combo||0)>=5){ // 连击计数：右上角跳动显示
    const pulse=1+Math.max(0,(S.comboT||0)-2.3)*2; // 刚击杀时放大
    ctx.save(); ctx.translate(W-14,26); ctx.scale(pulse,pulse);
    ctx.font='bold '+(12+Math.min(10,S.combo/20))+'px sans-serif'; ctx.textAlign='right';
    ctx.fillStyle='rgba(255,170,60,'+Math.min(1,0.4+(S.comboT||0)/2.5).toFixed(2)+')';
    ctx.fillText('🔥 '+S.combo+' 连击',0,0); ctx.restore(); ctx.textAlign='left'; }
  if(S.bossCount>0){ // 顶部Boss血条：名字+血量
    let by=16;
    for(const e of S.enemies){
      if(e.type!=='boss')continue;
      const bw=220;
      ctx.font='bold 12px sans-serif'; ctx.textAlign='center';
      ctx.fillStyle='#ffb0c4';
      ctx.fillText('👿 '+e.bossName+(e.bossType==='qq'&&e.hp<e.maxhp/2?' ⚡狂暴':''), W/2, by);
      ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(W/2-bw/2, by+4, bw, 8);
      ctx.fillStyle=e.bossType==='qq'?'#4f8fe0':e.bossType==='pun'?'#9b59d0':'#e03e6e';
      ctx.fillRect(W/2-bw/2, by+4, bw*Math.max(0,e.hp)/e.maxhp, 8);
      by+=30;
    }
  }
  ctx.font='bold 11px monospace'; ctx.textAlign='left';
  if(false&&S.dbg){ ctx.fillStyle='#7fff9f'; const d=S.dbg; ctx.fillText('V46 \u00b7 FPS '+d.fps+' \u602a'+d.n+' \u5f39'+d.b+' \u654c\u5f39'+d.eb+' \u5f39\u8ba1'+d.bt, 8, H-8); } // 调试信息：正式版关闭
  if(S.redT>0){
    const a2=S.redT/0.2*0.45;
    const g2=ctx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.75);
    g2.addColorStop(0,'rgba(255,0,40,0)'); g2.addColorStop(1,'rgba(255,0,40,'+a2+')');
    ctx.fillStyle=g2; ctx.fillRect(-30,-30,W+60,H+60);
  }
  if(S.shake>0) ctx.restore();
}

function drawHero(){
  const x=S.px, y=S.py;
  const bounce=S.moving? -Math.abs(Math.sin(S.walkT*9))*4 : Math.sin(S.walkT*2)*0.8;
  const blink=S.hurtT>0&&Math.floor(S.hurtT*20)%2===0;
  const aim=S.aimA||0;
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(0,13,10,3,0,0,7); ctx.fill();
  ctx.save(); ctx.translate(0,bounce);
  if(blink) ctx.globalAlpha=0.5;
  const leg=Math.sin(S.walkT*9);
  ctx.fillStyle='#3d5a8c';
  ctx.fillRect(-6,4+Math.max(0,leg),5,9-Math.max(0,leg));
  ctx.fillRect(1,4+Math.max(0,-leg),5,9-Math.max(0,-leg));
  ctx.fillStyle=blink?'#ff8a8a':'#4a7fce'; ctx.fillRect(-7,-4,14,10);
  ctx.fillStyle='#5f93d9'; ctx.fillRect(-7,-4,14,4);
  ctx.fillStyle='#2e4a78'; ctx.fillRect(-7,2,14,1.5); // 腰带
  ctx.fillStyle='#ffd76a'; ctx.fillRect(-1.5,2,3,1.5); // 扣
  ctx.fillStyle='#f2c99a'; ctx.fillRect(-5,-13,10,9);
  ctx.fillStyle='#e8b070'; ctx.fillRect(-5,-6,10,1); // 下巴阴影
  ctx.fillStyle='#7a4a22'; ctx.fillRect(-5,-14,10,2); ctx.fillRect(-6,-13,2,4); ctx.fillRect(4,-13,2,4); // 发际线
  ctx.fillStyle='#8a5a30'; ctx.fillRect(-11,-3,4,7); // 背包
  ctx.fillStyle='#a8723e'; ctx.fillRect(-11,-3,4,2);
  const ex=Math.cos(aim)*2, ey=Math.sin(aim)*1.5;
  ctx.fillStyle='#222';
  ctx.fillRect(-3+ex,-10+ey,2,2); ctx.fillRect(1+ex,-10+ey,2,2);
  const CH=SAVE.char;
  if(CH==='scholar'){ // 📖 学者：蓝色尖顶巫师帽 + 肩上书本
    ctx.fillStyle='#3a5fd0'; ctx.beginPath(); ctx.moveTo(-6,-14); ctx.lineTo(6,-14); ctx.lineTo(0,-24); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#2847a8'; ctx.fillRect(-6,-15,12,2);
    ctx.fillStyle='#ffd76a'; ctx.fillRect(-1.2,-21,2.4,2.4); // 帽顶星
    ctx.fillStyle='#cfdcff'; ctx.fillRect(-13,-5,6,4); ctx.fillStyle='#2e4a78'; ctx.fillRect(-13,-3,6,1); // 书
  } else if(CH==='merchant'){ // 🛒 商人：金色礼帽 + 斜挎钱袋
    ctx.fillStyle='#e8b23a'; ctx.fillRect(-7,-16,14,4); ctx.fillStyle='#b8860f'; ctx.fillRect(-9,-13,18,2);
    ctx.fillStyle='#fff3c8'; ctx.fillRect(2,-15,3,1.2); // 帽上高光
    ctx.fillStyle='#8a5a30'; ctx.beginPath(); ctx.arc(11,2,3.5,0,7); ctx.fill(); // 钱袋
    ctx.fillStyle='#ffd76a'; ctx.fillRect(10.5,0.5,1,1.5); // 袋口金币
  } else if(CH==='engineer'){ // 🔧 工程师：黄色安全帽 + 护目镜
    ctx.fillStyle='#f2c230'; ctx.fillRect(-7,-16,14,4); ctx.fillRect(-9,-13,18,2);
    ctx.fillStyle='#c89510'; ctx.fillRect(-7,-12.5,14,1);
    ctx.fillStyle='#576b8c'; ctx.fillRect(-6,-11,5,2.5); ctx.fillRect(1,-11,5,2.5); // 护目镜
    ctx.fillStyle='#222'; ctx.fillRect(-6,-9,12,1); // 镜带
  } else { // ⚔️ 勇士：红色头盔 + 围巾飘带
    ctx.fillStyle='#d64545'; ctx.fillRect(-6,-15,12,4); ctx.fillRect(2,-13,7,2);
    ctx.fillStyle='#a02020'; ctx.fillRect(-6,-12,12,1); // 帽檐阴影
    const sw2=Math.sin(S.walkT*7)*2; // 围巾飘带
    ctx.fillStyle='#e05a5a'; ctx.fillRect(-10,-6+sw2*0.5,6,3); ctx.fillRect(-14,-5+sw2,5,3);
  }
  ctx.save(); ctx.rotate(aim);
  if(SAVE.weapon==='rocket'){ // 🚀 火箭筒建模
    ctx.fillStyle='#5c6b52'; ctx.fillRect(3,-4.5,21,9);      // 筒身
    ctx.fillStyle='#3e4a38'; ctx.fillRect(0,-6,5,12);        // 后座
    ctx.fillStyle='#2f382b'; ctx.fillRect(22,-6,5,12);       // 炮口
    ctx.fillStyle='#d05a3e'; ctx.fillRect(10,-5.5,6,3);      // 警示条
    ctx.fillStyle='#6b4a2f'; ctx.fillRect(8,4,4,6);          // 握把
  } else if(SAVE.weapon==='blade'){ // 🗡️ 砍刀建模（挥刀动作：从抬起劈下）
    const sp2=(S.swing||0)>0 ? 1-(S.swing/0.18) : 1; // 0抬起→1劈下
    ctx.rotate(-0.4+sp2*1.35);
    ctx.fillStyle='#6b4a2f'; ctx.fillRect(6,-1.5,7,3);       // 刀柄
    ctx.fillStyle='#dfe9f2'; ctx.beginPath();
    ctx.moveTo(13,-2.5); ctx.lineTo(30,-2); ctx.lineTo(34,1.5); ctx.lineTo(13,2.5); ctx.closePath(); ctx.fill(); // 刀刃
    ctx.fillStyle='#8fa0ad'; ctx.fillRect(13,-2.5,5,5);      // 刀背铆接
    ctx.fillStyle='#aebccb'; ctx.fillRect(13,-1,17,1);       // 刀线
  } else { // 🔫 手枪建模
    ctx.fillStyle='#454c5c'; ctx.fillRect(6,-2,12,4);
    ctx.fillStyle='#2f3440'; ctx.fillRect(4,-3,5,6);
    ctx.fillStyle='#ffd76a'; ctx.fillRect(16,-1.5,2,3); // 准星
  }
  if(S.muzzle>0&&!blink){ // 枪口火光
    ctx.fillStyle='rgba(255,220,110,.9)';
    const mx=SAVE.weapon==='rocket'?27:SAVE.weapon==='blade'?0:18;
    if(SAVE.weapon!=='blade'){ ctx.beginPath(); ctx.arc(mx,0,5+Math.random()*2,0,7); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.95)'; ctx.beginPath(); ctx.arc(mx,0,2.5,0,7); ctx.fill(); }
  }
  ctx.restore();
  ctx.restore();
  ctx.restore();
  ctx.globalAlpha=1;
}

function showPage(name){
  const prevPage=page;
  page=name; pickMade=(name==='defend')?pickMade:false; // 布防页保留已选关卡
  if(typeof dragCleanup!=='undefined'&&dragCleanup){ dragCleanup(); dragCleanup=null; } // 页面切换强制清理拖拽监听（根治滚动锁死）
  Spot.hide(); // 页面切换清除聚光灯（新指引由各页自行点亮）
  AudioSys.stopMusic();
  if(name==='select'&&prevPage!=='select'&&!pickMade) selLevel=Math.min(SAVE.unlocked,5); // 仅首次进入默认选最高解锁关；换武器/角色不再跳关
  const P=PAGES[name];
  S=null; cancelAnimationFrame(raf);
  ovT.textContent=typeof P.title==='function'?P.title():P.title;
  ovX.innerHTML=P.text();
  ch.innerHTML='';
  P.render();
  btn.classList.add('hidden'); pauseBtn.classList.add('hidden'); dashBtn.classList.add('hidden');
  ov.classList.add('menu'); ov.classList.remove('hidden');
  nav.classList.remove('hidden');
  navShop.textContent=P.nav.shop;
  navRoster.onclick=()=>showPage(name==='roster'?'select':'roster'); // 🎭 角色/武器选择页
  if(dtBack){ ov.removeEventListener('click',dtBack); dtBack=null; } // 离开详情页时清除空白退出监听
  navReward.textContent=(page==='reward')?'🏠 主页':'🎁 奖励';
  navRoster.textContent=(page==='roster')?'🏠 主页':'🎭 角色';
  navPlay.textContent=typeof P.nav.play==='function'?P.nav.play():P.nav.play;
  navPlay.disabled=false;
  navShop.onclick=()=>showPage(name==='shop'?'home':'shop');
  navReward.onclick=()=>showPage(page==='reward'?'home':'reward');
  navPlay.onclick=()=>{
    if(P.nav.playGo==='start'){
      if(!pickMade && page==='select'){ // 未选关，不允许直接开战
        navPlay.disabled=true; navPlay.style.opacity=.6;
        ovT.textContent='⚠️ 请先点上方一个关卡';
        setTimeout(()=>{ navPlay.disabled=false; navPlay.style.opacity=1;
          ovT.textContent=(()=>{const Q=PAGES[page];return typeof Q.title==='function'?Q.title():Q.title;})(); }, 900);
        return;
      }
      navPlay.style.opacity=1;
      startLevel();
    } else showPage(P.nav.playGo);
  };
}
function buildDaily(){
  // ---- 每日签到卡片（从主页迁入奖励中心） ----
  if(checkDailySign()){
    if(SAVE.lastSign && SAVE.lastSign!==todayStr()){
      const y=new Date(Date.now()-86400000);
      const yStr=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
      if(SAVE.lastSign!==yStr) SAVE.signStreak=0;
    }
    const day=(SAVE.signStreak||0)+1;
    const base=[200,300,400,500,600,800,1000][(day-1)%7];
    const gift=day===7?500:0;
    const sc=document.createElement('div'); sc.id='signCard'; sc.className='card';
